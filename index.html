    function initializeGalleryCredits() {
      document
        .querySelectorAll(".gallery-slot")
        .forEach(slot => {
          const card =
            slot.querySelector(".gallery-card");

          if (!card) {
            return;
          }

          const showCredit = () => {
            slot.classList.add(
              "credit-visible"
            );
          };

          const hideCredit = () => {
            slot.classList.remove(
              "credit-visible"
            );
          };

          card.addEventListener(
            "click",
            showCredit
          );

          card.addEventListener(
            "pointerleave",
            hideCredit
          );

          card.addEventListener(
            "pointercancel",
            hideCredit
          );

          card.addEventListener(
            "blur",
            hideCredit
          );

          card.addEventListener(
            "keydown",
            event => {
              if (
                event.key !== "Enter" &&
                event.key !== " "
              ) {
                return;
              }

              event.preventDefault();
              showCredit();
            }
          );
        });
    }

    function initializeGalleryTilt() {
      const canTilt =
        window.matchMedia(
          "(min-width: 1101px) and (pointer: fine)"
        );

      document
        .querySelectorAll("[data-gallery-tilt]")
        .forEach(card => {
          let animationFrame = 0;

          const resetTilt = () => {
            cancelAnimationFrame(animationFrame);

            card.classList.remove(
              "is-tilting"
            );

            requestAnimationFrame(() => {
              card.style.setProperty(
                "--tilt-x",
                "0deg"
              );

              card.style.setProperty(
                "--tilt-y",
                "0deg"
              );
            });
          };

          card.addEventListener(
            "pointermove",
            event => {
              if (!canTilt.matches) {
                resetTilt();
                return;
              }

              card.classList.add(
                "is-tilting"
              );

              const bounds =
                card.getBoundingClientRect();

              const x =
                (event.clientX - bounds.left) /
                bounds.width;

              const y =
                (event.clientY - bounds.top) /
                bounds.height;

              const rotateY =
                (x - 0.5) * 24;

              const rotateX =
                (0.5 - y) * 20;

              cancelAnimationFrame(
                animationFrame
              );

              animationFrame =
                requestAnimationFrame(() => {
                  card.style.setProperty(
                    "--tilt-x",
                    `${rotateX.toFixed(2)}deg`
                  );

                  card.style.setProperty(
                    "--tilt-y",
                    `${rotateY.toFixed(2)}deg`
                  );
                });
            }
          );

          card.addEventListener(
            "pointerleave",
            resetTilt
          );

          card.addEventListener(
            "pointercancel",
            resetTilt
          );
        });
    }

    initializeGalleryCredits();
    initializeGalleryTilt();

    function setMetaContent(selector, value) {
      const element =
        document.querySelector(selector);

      if (element) {
        element.setAttribute(
          "content",
          String(value || "")
        );
      }
    }

    function resolveRuntimeEmbedAsset(
      value,
      websiteUrl
    ) {
      const asset = String(value || "").trim();

      if (!asset) {
        return "";
      }

      try {
        return new URL(asset).href;
      } catch {
        try {
          return new URL(
            asset.replace(/^\/+/, ""),
            websiteUrl.endsWith("/")
              ? websiteUrl
              : `${websiteUrl}/`
          ).href;
        } catch {
          return asset;
        }
      }
    }

    function applyRuntimeEmbedMetadata(data) {
      const embed = data.embed || {};

      if (embed.enabled === false) {
        return;
      }

      const websiteUrl =
        String(embed.url || "").trim();

      const title =
        embed.title ||
        data.name ||
        data.pageTitle ||
        "yuta";

      const description =
        embed.description ||
        data.bio ||
        "";

      const image =
        resolveRuntimeEmbedAsset(
          embed.image ||
          data.banner ||
          data.avatar ||
          "",
          websiteUrl
        );

      const color =
        embed.color ||
        data.style?.universalColor ||
        "#707070";

      setMetaContent(
        'meta[name="description"]',
        description
      );

      setMetaContent(
        'meta[name="theme-color"]',
        color
      );

      setMetaContent(
        'meta[property="og:title"]',
        title
      );

      setMetaContent(
        'meta[property="og:description"]',
        description
      );

      setMetaContent(
        'meta[name="twitter:title"]',
        title
      );

      setMetaContent(
        'meta[name="twitter:description"]',
        description
      );

      setMetaContent(
        'meta[name="twitter:card"]',
        embed.card === "small"
          ? "summary"
          : "summary_large_image"
      );

      if (websiteUrl) {
        setMetaContent(
          'meta[property="og:url"]',
          websiteUrl
        );
      }

      if (image) {
        setMetaContent(
          'meta[property="og:image"]',
          image
        );

        setMetaContent(
          'meta[name="twitter:image"]',
          image
        );
      }
    }

    function isTwitterOrXLink(url) {
      try {
        const host =
          new URL(
            url,
            window.location.href
          )
            .hostname
            .toLowerCase()
            .replace(/^www\./, "");

        return (
          host === "x.com" ||
          host.endsWith(".x.com") ||
          host === "twitter.com" ||
          host.endsWith(".twitter.com")
        );
      } catch (error) {
        return false;
      }
    }

    function isMobileLinkEnvironment() {
      return (
        window.matchMedia(
          "(pointer: coarse)"
        ).matches ||
        window.matchMedia(
          "(max-width: 1100px)"
        ).matches
      );
    }
