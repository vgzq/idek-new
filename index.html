          try {
            const source =
              context.createBufferSource();

            const gainNode =
              context.createGain();

            const compressor =
              context.createDynamicsCompressor();

            source.buffer = unlockBeepBuffer;
            gainNode.gain.value =
              ENTRY_UNLOCK_BEEP_GAIN;

            compressor.threshold.value = -10;
            compressor.knee.value = 12;
            compressor.ratio.value = 4;
            compressor.attack.value = 0.003;
            compressor.release.value = 0.18;

            gainNode.connect(compressor);
            compressor.connect(
              context.destination
            );

            unlockBeepSource = source;
            unlockBeepGainNode = gainNode;
            unlockBeepCompressor =
              compressor;

            source.addEventListener(
              "ended",
              () => {
                try {
                  source.disconnect();
                  gainNode.disconnect();
                  compressor.disconnect();
                } catch {
                  // Already disconnected.
                }

                  unlockBeepSource === source
                ) {
                  unlockBeepSource = null;
                  unlockBeepGainNode = null;
                  unlockBeepCompressor =
                    null;
                }
              },
              { once: true }
            );

            source.start(0);
          } catch (error) {
            console.warn(
              "Could not play Web Audio unlock beep:",
              error
            );
          }
        };

          void context.resume().then(
            beginWebAudioBeep,
            beginWebAudioBeep

          beginWebAudioBeep();
