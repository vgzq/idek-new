  <script>
    (() => {
      const userAgent =
        navigator.userAgent || "";

      const isTikTokInAppBrowser =
        /TikTok|musical_ly|BytedanceWebview|ByteLocale|zhiliaoapp/i
          .test(userAgent);

      if (isTikTokInAppBrowser) {
        document.documentElement.classList.add(
          "tiktok-inapp-browser"
        );
      }
    })();
  </script>

  <script>
    (() => {
      const path = window.location.pathname;
      const lastPart = path.split("/").pop();

      if (
        lastPart &&
        !lastPart.includes(".") &&
        !path.endsWith("/")
      ) {
        window.location.replace(
          path + "/" +
          window.location.search +
          window.location.hash
        );
      }
    })();
  </script>

  <style>
    :root {
      --background: #000000;
      --text-color: #4b3866;
      --bio-color: #3f3358;
      --hover-color: #ffffff;
      --name-gradient-start: #6f4f8f;
      --name-gradient-end: #c2a0ff;
      --discord-card-background: #111111;
      --discord-name-color: #ffffff;
      --discord-username-color: #a3a3a3;
      --clock-face-color: #111111;
      --clock-text-color: #f1f1f1;
      --clock-secondary-color: #777777;
      --clock-accent-color: #6f4f8f;
      --track-text-color: #f1f1f1;
      --track-secondary-color: #777777;
      --track-accent-color: #6f4f8f;
      --profile-scale: 1;
      --bio-size: 14px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      background: var(--background);
      color: var(--text-color);
      font-family: "Inter", Arial, sans-serif;
    }

    .banner {
      width: 100%;
      height: 420px;
      background-color: #ffffff;
      background-repeat: no-repeat;
      background-position: center;
      background-size: cover;
    }

    .content {
      min-height: calc(100vh - 420px);
      padding-bottom: 80px;
      background: var(--background);
    }

    .profile {
      width: 640px;
      max-width: calc(100vw - 40px);
      margin: 0 auto;
      transform: scale(var(--profile-scale));
      transform-origin: top center;
    }

    .top-row {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 24px;
      transform: translateY(-70px);
      margin-bottom: -40px;
    }

    .avatar {
      width: 140px;
      height: 140px;
      flex-shrink: 0;
      border-radius: 50%;
      object-fit: cover;
      opacity: 0;
      transform:
        translateY(8px)
        scale(0.96);
      will-change: opacity, transform;
    }

    body.site-entered .avatar {
      animation:
        profileAvatarEnter
        820ms
        cubic-bezier(0.2, 0.75, 0.2, 1)
        140ms
        forwards;
    }

    @keyframes profileAvatarEnter {
      from {
        opacity: 0;
        transform:
          translateY(8px)
          scale(0.96);
      }

      to {
        opacity: 1;
        transform:
          translateY(0)
          scale(1);
      }
    }

    .identity {
      min-width: 180px;
      padding-top: 80px;
      text-align: left;
    }

    h1 {
      margin: 0;
      color: transparent;
      font-size: 32px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: -1px;

      background-image: linear-gradient(
        90deg,
        var(--name-gradient-start),
        var(--name-gradient-end),
        var(--name-gradient-start)
      );
      background-size: 200% 100%;
      background-position: 0% 50%;
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;

      animation: nameGradientShift 4s linear infinite;
      opacity: 0;
      will-change: opacity;
    }

    body.site-entered #name {
      animation:
        nameGradientShift 4s linear infinite,
        profileTextFadeIn
        820ms
        cubic-bezier(0.2, 0.75, 0.2, 1)
        140ms
        both;
    }

    .bio {
      margin: 10px 0 0;
      color: var(--bio-color);
      font-size: var(--bio-size);
      font-weight: 500;
      opacity: 0;
      will-change: opacity;
    }

    body.site-entered .bio {
      animation:
        profileTextFadeIn
        820ms
        cubic-bezier(0.2, 0.75, 0.2, 1)
        140ms
        both;
    }

    @keyframes profileTextFadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .links {
      display: grid;
      grid-template-columns: 190px 190px;
      column-gap: 132px;
      row-gap: 38px;
      width: 512px;
      margin: 8px 0 0 26px;
    }

    .link {
      display: flex;
      align-items: center;
      gap: 18px;
      width: 190px;
      min-height: 34px;
      color: var(--text-color);
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      opacity: 0.9;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      transition:
        color 0.2s ease,
        opacity 0.2s ease,
        transform 0.2s ease;
    }

    .link:hover {
      color: var(--hover-color);
      opacity: 1;
      transform: translateY(-2px);
    }

    .icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      flex-shrink: 0;
      color: var(--icon-color, inherit);
      transition: color 0.2s ease;
    }

    .link:hover .icon {
      color: inherit;
    }

    .icon svg {
      display: block;
      width: 24px;
      height: 24px;
      fill: currentColor;
    }

    .icon-mask {
      display: block;
      width: 24px;
      height: 24px;
      background-color: currentColor;

      -webkit-mask-repeat: no-repeat;
      -webkit-mask-position: center;
      -webkit-mask-size: contain;

      mask-repeat: no-repeat;
      mask-position: center;
      mask-size: contain;
    }

    .discord-module {
      width: 512px;
      margin: 8px 0 38px 26px;
    }

    .discord-module[hidden] {
      display: none;
    }

    .discord-card {
      position: relative;
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      min-height: 76px;
      padding: 12px 16px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.035);
      border-radius: 14px;
      background: var(--discord-card-background);
      color: var(--discord-name-color);
      text-decoration: none;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.025),
        0 8px 24px rgba(0, 0, 0, 0.18);
      isolation: isolate;
      transition:
        transform 0.2s ease,
        border-color 0.2s ease;
    }

    .discord-card:hover {
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.08);
    }

    .discord-card::before {
      content: "";
      position: absolute;
      inset: -70% -20%;
      z-index: -1;
      pointer-events: none;
      background: linear-gradient(
        110deg,
        transparent 42%,
        rgba(255, 255, 255, 0.11) 51%,
        transparent 60%
      );
      transform: translateX(-65%);
      animation: discordCardShine 7s ease-in-out infinite;
    }

    .discord-avatar-wrap {
      position: relative;
      width: 50px;
      height: 50px;
      flex-shrink: 0;
    }

    .discord-avatar {
      display: block;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      object-fit: cover;
      background: #181818;
    }

    .discord-status {
      position: absolute;
      right: -1px;
      bottom: -1px;
      width: 15px;
      height: 15px;
      border: 3px solid var(--discord-card-background);
      border-radius: 50%;
      background: #80848e;
    }

    .discord-text {
      min-width: 0;
    }

    .discord-name,
    .discord-username {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .discord-name {
      color: var(--discord-name-color);
      font-size: 15px;
      line-height: 1.25;
      font-weight: 700;
    }

    .discord-username {
      margin-top: 4px;
      color: var(--discord-username-color);
      font-size: 13px;
      line-height: 1.2;
      font-weight: 500;
    }

    @keyframes discordCardShine {
      0%,
      30% {
        transform: translateX(-65%);
      }

      65%,
      100% {
        transform: translateX(65%);
      }
    }

    @keyframes nameGradientShift {
      from {
        background-position: 0% 50%;
      }

      to {
        background-position: 200% 50%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      h1,
      .discord-card::before {
        animation: none;
      }

      h1 {
        background-position: 50% 50%;
      }
    }

    @media (max-width: 700px) {
      .banner {
        height: 280px;
      }

      .content {
        min-height: calc(100vh - 280px);
      }

      .profile {
        width: min(88vw, 430px);
      }

      .top-row {
        gap: 18px;
        transform: translateY(-54px);
        margin-bottom: -18px;
      }

      .avatar {
        width: 108px;
        height: 108px;
      }

      .identity {
        min-width: 0;
        padding-top: 26px;
      }

      h1 {
        font-size: 29px;
      }

      .links {
        grid-template-columns: 1fr;
        width: 100%;
        margin: 8px 0 0;
        row-gap: 24px;
      }

      .link {
        width: 210px;
      }

      .discord-module {
        width: 100%;
        margin: 12px 0 28px;
      }
    }


    /* Full-page scroll layout */
    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      min-height: 0;
    }

    .snap-container {
      position: relative;
      width: 100%;
      height: 100svh;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: pan-y;
      opacity: 1;
    }

    .snap-track {
      width: 100%;
      height: 100%;
      will-change: transform;
      transform: translate3d(0, 0, 0);
      transition:
        transform 420ms cubic-bezier(0.22, 0.8, 0.25, 1);
    }

    .snap-page {
      position: relative;
      width: 100%;
      height: 100svh;
      min-height: 100svh;
      overflow: hidden;
      background: var(--background);
    }

    .profile-page {
      display: block;
      isolation: isolate;
      background-color: #000000;
    }

    .profile-background-boot {
      position: absolute;
      inset: 0;
      z-index: 0;
      background-image: url("bg.png");
      background-image: image-set(
        url("bg.webp") type("image/webp"),
        url("bg.png") type("image/png")
      );
      background-repeat: no-repeat;
      background-position: center;
      background-size: cover;
      opacity: 0;
      filter:
        brightness(0.2)
        contrast(1.12);
      pointer-events: none;
      will-change: opacity, filter;
    }

    .profile-background-boot.booting {
      animation:
        profileMonitorBoot
        1900ms
        linear
        0ms
        forwards;
    }

    @keyframes profileMonitorBoot {
      0% {
        opacity: 0;
        filter:
          brightness(0.12)
          contrast(1.18);
      }

      7% {
        opacity: 0.15;
        filter:
          brightness(0.48)
          contrast(1.24);
      }

      11% {
        opacity: 0;
      }

      18% {
        opacity: 0.3;
        filter:
          brightness(0.67)
          contrast(1.2);
      }

      22% {
        opacity: 0.03;
      }

      29% {
        opacity: 0.18;
        filter:
          brightness(0.58)
          contrast(1.2);
      }

      33% {
        opacity: 0;
      }

      41% {
        opacity: 0.53;
        filter:
          brightness(0.8)
          contrast(1.13);
      }

      46% {
        opacity: 0.11;
      }

      54% {
        opacity: 0.35;
        filter:
          brightness(0.73)
          contrast(1.14);
      }

      58% {
        opacity: 0.08;
      }

      66% {
        opacity: 0.76;
        filter:
          brightness(0.91)
          contrast(1.08);
      }

      71% {
        opacity: 0.3;
      }

      78% {
        opacity: 0.93;
        filter:
          brightness(1.02)
          contrast(1.04);
      }

      82% {
        opacity: 0.57;
      }

      89% {
        opacity: 1;
        filter:
          brightness(1.04)
          contrast(1.02);
      }

      93% {
        opacity: 0.74;
      }

      100% {
        opacity: 1;
        filter:
          brightness(1)
          contrast(1);
      }
    }

    .profile-background-boot.ready {
      opacity: 1;
      filter:
        brightness(1)
        contrast(1);
    }

    .profile-page .banner {
      display: none;
    }

    .profile-content {
      position: absolute;
      inset: 0;
      z-index: 2;
      width: min(1200px, calc(100vw - 80px));
      min-height: 0;
      margin: 0 auto;
      padding: 0;
      background: transparent;
      container-type: inline-size;
    }

    .profile-page .profile {
      position: absolute;
      top: 50%;
      left: 18%;
      width: auto;
      max-width: none;
      margin: 0;
      padding: 0;
      transform:
        translateY(-50%)
        scale(var(--profile-scale));
      transform-origin: left center;
    }

    .profile-page .top-row {
      align-items: center;
      gap: clamp(28px, 4.333cqw, 52px);
      margin: 0;
      transform: none;
    }

    .profile-page .avatar {
      width: clamp(118px, 13.5cqw, 162px);
      height: clamp(118px, 13.5cqw, 162px);
    }

    .profile-page .identity {
      min-width: 0;
      padding: 0;
    }

    .profile-page .links,
    .profile-page .scroll-hint {
      display: none;
    }

    .module-page {
      display: grid;
      place-items: center;
      padding: 72px 100px;
      isolation: isolate;
    }

    .module-page::before {
      content: "";
      position: absolute;
      width: min(700px, 70vw);
      height: min(700px, 70vw);
      border-radius: 50%;
      background: radial-gradient(
        circle,
        color-mix(in srgb, var(--text-color) 13%, transparent),
        transparent 68%
      );
      filter: blur(18px);
      opacity: 0.7;
      z-index: -1;
      pointer-events: none;
    }

    .module-inner {
      width: min(620px, calc(100vw - 160px));
    }

    .page-kicker {
      margin-bottom: 14px;
      color: var(--bio-color);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    .page-title {
      margin: 0 0 36px;
      color: var(--clock-text-color);
      font-size: clamp(38px, 5vw, 68px);
      line-height: 0.95;
      font-weight: 800;
      letter-spacing: -0.055em;
    }

    .social-page .module-inner {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      width: max-content;
      max-width: calc(100vw - 160px);
    }

    .social-page .page-kicker {
      width: 100%;
      margin-bottom: 28px;
      text-align: left;
    }

    .social-page .links {
      display: grid;
      grid-template-columns: repeat(2, 220px);
      justify-content: center;
      column-gap: clamp(56px, 7vw, 110px);
      row-gap: 34px;
      width: max-content;
      margin: 0 auto;
    }

    .social-page .link {
      width: 220px;
      min-height: 40px;
      font-size: 16px;
    }

    .social-page .link:nth-child(odd):last-child {
      grid-column: 1 / -1;
      justify-self: center;
    }

    @media (min-width: 1101px) and (pointer: fine) {
      .social-page .module-inner {
        transform: translateX(36px);
      }
    }

    .combined-page {
      display: grid;
      place-items: center;
      padding: 52px 100px;
    }

    .combined-page::before {
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .combined-module-inner {
      display: flex;
      flex-direction: column;
      width: min(880px, calc(100vw - 180px));
      height: auto;
      max-height: min(720px, calc(100svh - 104px));
      min-height: 0;
      margin: 0 auto;
    }

    @media (min-width: 1101px) and (pointer: fine) {
      .combined-module-inner {
        transform: translateX(76px);
      }
    }

    .combined-page .page-kicker {
      width: min(760px, 100%);
      margin: 0 auto 14px;
      text-align: left;
    }

    .combined-modules {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr);
      align-items: center;
      gap: clamp(48px, 7vw, 96px);
      width: min(760px, 100%);
      margin: 24px auto 0;
    }

    .combined-discord,
    .combined-clock {
      width: 100%;
      min-width: 0;
    }

    .gallery-page {
      display: grid;
      place-items: center;
      padding: 52px 100px;
    }

    .gallery-page[hidden] {
      display: none;
    }

    .gallery-page::before {
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .gallery-module-inner {
      display: flex;
      flex-direction: column;
      width: min(880px, calc(100vw - 220px));
      height: min(720px, calc(100svh - 104px));
      min-height: 0;
      margin: 0 auto;
      transform: translateY(28px);
    }

    @media (min-width: 1101px) and (pointer: fine) {
      .gallery-module-inner {
        transform: translate(54px, 28px);
      }
    }

    .gallery-page .page-kicker {
      width: min(760px, 100%);
      margin: 0 auto 20px;
      text-align: left;
      transform: translateY(10px);
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      width: min(760px, 100%);
      height: min(570px, calc(100svh - 190px));
      margin: 0 auto;
      perspective: 1100px;
      pointer-events: none;
    }

    .gallery-slot {
      position: relative;
      display: flex;
      justify-content: center;
      min-width: 0;
      pointer-events: auto;
    }

    .gallery-credit {
      position: absolute;
      top: 50%;
      z-index: 3;
      color: var(--bio-color);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.22em;
      line-height: 1;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition:
        opacity 260ms ease,
        transform 360ms
          cubic-bezier(0.16, 1, 0.3, 1);
    }

    .gallery-slot:first-child .gallery-credit {
      left:
        calc(
          50% +
          clamp(130px, 11vw, 175px) +
          22px
        );
      transform:
        translate(-8px, -50%);
    }

    .gallery-slot:last-child .gallery-credit {
      right:
        calc(
          50% +
          clamp(130px, 11vw, 175px) +
          22px
        );
      transform:
        translate(8px, -50%);
    }

    .gallery-slot.credit-visible
      .gallery-credit {
      opacity: 1;
      transform: translate(0, -50%);
    }

    .gallery-slot:first-child {
      grid-row: 1;
      grid-column: 1;
      align-self: end;
      transform: translateY(-12px);
    }

    .gallery-slot:last-child {
      grid-row: 2;
      grid-column: 2;
      align-self: start;
      transform: translateY(14px);
    }

    .gallery-card {
      --tilt-x: 0deg;
      --tilt-y: 0deg;
      --tilt-scale: 1;

      position: relative;
      display: block;
      width: clamp(260px, 22vw, 350px);
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 12px;
      background: #090909;
      box-shadow:
        0 18px 48px rgba(0,0,0,0.42),
        inset 0 0 0 1px rgba(255,255,255,0.018);
      transform:
        perspective(950px)

    }

    .entry-terminal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
      color: rgba(255,255,255,0.28);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.17em;
      line-height: 1;
      text-transform: uppercase;
    }

    .entry-terminal-status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .entry-terminal-status::before {
      content: "";
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #574F64;
      box-shadow: 0 0 9px rgba(87,79,100,0.64);
      animation:
        entryStatusPulse
        1.5s
        ease-in-out
        infinite;
    }

    @keyframes entryStatusPulse {
      0%,
      100% {
        opacity: 0.35;
      }

      50% {
        opacity: 1;
      }
    }

    .entry-boot-lines {
      display: grid;
      gap: 11px;
      min-height: 112px;
      font-size: 14px;
      line-height: 1.4;
    }

    .entry-boot-line {
      display: flex;
      align-items: baseline;
      gap: 10px;
      opacity: 0;
      transform: translateY(3px);
      animation:
        entryBootLineReveal
        340ms
        steps(5, end)
        forwards;
    }

    .entry-boot-line::before {
      content: ">";
      color: #574F64;
      opacity: 0.84;
    }

    .entry-boot-line:nth-child(1) {
      animation-delay: 180ms;
    }

    .entry-boot-line:nth-child(2) {
      animation-delay: 720ms;
    }

    .entry-boot-line:nth-child(3) {
      animation-delay: 1260ms;
    }

    .entry-boot-line:nth-child(4) {
      animation-delay: 1800ms;
      color: rgba(255,255,255,0.82);
    }

    @keyframes entryBootLineReveal {
      from {
        opacity: 0;
        transform: translateY(3px);
        filter: blur(1px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
      }
    }

    .entry-terminal-cursor {
      display: inline-block;
      width: 7px;
      height: 1em;
      margin-left: 3px;
      vertical-align: -0.16em;
      background: #574F64;
      animation:
        entryCursorBlink
        760ms
        steps(1, end)
        infinite;
    }

    @keyframes entryCursorBlink {
      0%,
      48% {
        opacity: 1;
      }

      49%,
      100% {
        opacity: 0;
      }
    }

    .entry-terminal-action {
      display: block;
      width: auto;
      margin: 0;
      padding: 0;
      border: 0;
      color: rgba(255,255,255,0.72);
      font-size: 16px;
      font-weight: 400;
      letter-spacing: 0;
      line-height: 1.4;
      text-align: center;
      text-transform: none;
      opacity: 1;
      animation: none;
    }

    .entry-mobile-disclaimer {
      display: none;
      color: rgba(255,255,255,0.34);
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 0.02em;
      line-height: 1.3;
      text-align: center;
    }

    @keyframes entryActionReveal {
      from {
        opacity: 0;
        transform: translateY(4px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes entryActionBreathe {
      0%,
      100% {
        color: rgba(255,255,255,0.58);
      }

      50% {
        color: rgba(255,255,255,0.88);
      }
    }

    .enter-screen:not(:disabled):hover
      .entry-terminal-action {
      color: rgba(255,255,255,0.82);
    }

    .entry-lock {
      position: absolute;
      top: 50%;
      left: 50%;
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      color: #574F64;
      opacity: 0;
      transform: translate(-50%, -18px);
      filter: brightness(0.2) contrast(1.12);
      pointer-events: none;
      will-change: opacity, filter, transform;
      transition:
        filter 220ms ease,
        opacity 220ms ease;
    }

    .entry-lock svg {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
      filter: drop-shadow(0 0 12px rgba(255,255,255,0.22));
    }



    .entry-lock-shackle {
      transform-box: fill-box;
      transform-origin: left bottom;
      backface-visibility: hidden;
      transform: translate3d(0, 0, 0) rotate(0deg);
      will-change: transform, opacity;
    }

    .enter-screen.unlocking .enter-copy {
      opacity: 0;
      transform: translateY(-4px);
    }

    .enter-screen.unlocking .entry-lock {
      color: #574F64;
      animation:
        entryLockFlicker
        420ms
        linear
        forwards;
    }

    .enter-screen.unlocking .entry-lock-shackle {
      animation:
        entryLockShackleRelease
        520ms
        cubic-bezier(0.18, 0.72, 0.22, 1)
        420ms
        both;
    }

    .enter-screen.revealing {
      pointer-events: none;
    }

    @keyframes entryLockFlicker {
      0% {
        opacity: 0;
        filter: brightness(0.16) contrast(1.18);
      }

      10% {
        opacity: 0.28;
        filter: brightness(0.66) contrast(1.2);
      }

      17% {
        opacity: 0.04;
      }

      28% {
        opacity: 0.56;
        filter: brightness(0.84) contrast(1.12);
      }

      36% {
        opacity: 0.12;
      }

      52% {
        opacity: 0.82;
        filter: brightness(0.96) contrast(1.06);
      }

      61% {
        opacity: 0.38;
      }

      76% {
        opacity: 1;
        filter: brightness(1.04) contrast(1.02);
      }

      84% {
        opacity: 0.72;
      }

      100% {
        opacity: 1;
        filter: brightness(1) contrast(1);
      }
    }

    @keyframes entryLockShackleRelease {
      from {
        transform: translate3d(0, 0, 0) rotate(0deg);
      }

      to {
        transform: translate3d(-10px, -22px, 0) rotate(-24deg);
      }
    }

    .enter-screen:disabled {
      cursor: default;
    }

    .enter-screen.entered {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .scroll-direction-indicator {
      position: fixed;
      bottom: 36px;
      left: 50%;
      z-index: 110;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: rgba(255,255,255,0.34);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.16em;
      line-height: 1;
      text-transform: uppercase;
      opacity: 0;
      transform: translateX(-50%);
      pointer-events: none;
      user-select: none;
      will-change: opacity;
    }

    .scroll-direction-indicator.is-visible {
      animation:
        scrollIndicatorFadeIn
        720ms
        ease
        1260ms
        both;
    }

    @keyframes scrollIndicatorFadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .scroll-direction-indicator[hidden] {
      display: none;
    }

    .scroll-direction-arrow {
      position: relative;
      display: block;
      width: 14px;
      height: 8px;
      opacity: 0.72;
      transition:
        opacity 180ms ease,
        transform 180ms ease;
    }

    .scroll-direction-arrow::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 7px;
      height: 7px;
      border-top: 1.5px solid currentColor;
      border-left: 1.5px solid currentColor;
    }

    .scroll-direction-arrow.up::before {
      transform:
        translate(-50%, -24%)
        rotate(45deg);
    }

    .scroll-direction-arrow.down::before {
      transform:
        translate(-50%, -76%)
        rotate(225deg);
    }

    .scroll-direction-arrow.is-hidden {
      opacity: 0;
      visibility: hidden;
    }

    .scroll-direction-arrow.up:not(.is-hidden) {
      animation: scrollArrowUp 1.6s ease-in-out infinite;
    }

    .scroll-direction-arrow.down:not(.is-hidden) {
      animation: scrollArrowDown 1.6s ease-in-out infinite;
    }

    @keyframes scrollArrowUp {
      0%, 100% { transform: translateY(2px); }
      50% { transform: translateY(-3px); }
    }

    @keyframes scrollArrowDown {
      0%, 100% { transform: translateY(-2px); }
      50% { transform: translateY(3px); }
    }

    .scroll-hint {
      position: absolute;
      right: 30px;
      bottom: 24px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 0;
      border: 0;
      background: transparent;
      color: rgba(255,255,255,0.38);
      font: inherit;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      cursor: pointer;
    }

    .scroll-hint::after {
      content: "↓";
      font-size: 16px;
      animation: scrollHint 1.8s ease-in-out infinite;
    }

    @keyframes scrollHint {
      0%, 100% { transform: translateY(-2px); }
      50% { transform: translateY(5px); }
    }

    @media (max-width: 760px) {
      .profile-background-boot {
        background-position: 66% center;
      }

      .profile-content {
        width: calc(100vw - 40px);
      }

      .profile-page .profile {
        top: 50%;
        left: 0;
      }

      .profile-page .top-row {
        gap: 22px;
      }

      .profile-page .avatar {
        width: 108px;
        height: 108px;
      }

      .profile-page .identity {
        max-width: 48vw;
      }

      .profile-page h1 {
        font-size: 28px;
      }

      .module-page {
        padding: 60px 40px;
      }

      .module-inner,
      .social-page .module-inner,
      .combined-module-inner {
        width: min(100%, 520px);
      }

      .social-page .links {
        grid-template-columns: 220px;
        justify-content: center;
        row-gap: 24px;
      }

      .social-page .link:nth-child(odd):last-child {
        grid-column: auto;
      }

      .combined-page {
        padding: 44px 40px;
      }

      .combined-module-inner {
        width: min(100%, 520px);
        height: auto;
        max-height: calc(100svh - 88px);
      }

      .combined-modules {
        grid-template-columns: 1fr;
        width: 100%;
        gap: 28px;
      }

      .clock-layout {
        grid-template-columns: 62px minmax(0, 1fr);
        justify-items: stretch;
        gap: 18px;
        text-align: left;
      }

      .tracklist-module {
        width: 100%;
        max-height: calc(100svh - 360px);
        margin-top: 36px;
      }

      .track-row {
        grid-template-columns: 34px minmax(0, 1fr) 34px;
        min-height: 50px;
      }

      .page-indicator {
        right: 14px;
      }

      .page-indicator-button {
        min-width: 48px;
        font-size: 10px;
      }

      .page-indicator-button::before {
        width: 10px;
      }

      .page-indicator-button.active::before {
        width: 24px;
      }

      .scroll-hint {
        right: 18px;
        bottom: 18px;
      }
    }

    @media (max-width: 1100px), (pointer: coarse) {
      .tracklist-module {
        visibility: visible;
        overflow-y: auto;
      }

      .tracklist-module .tracklist-heading,
      .tracklist-module .track-row,
      .tracklist-module .tracklist-controls {
        opacity: 1 !important;
        transform: none !important;
        animation: none !important;
      }

      .tracklist-module .tracklist {
        border-top-color: color-mix(
          in srgb,
          var(--track-secondary-color) 28%,
          transparent
        ) !important;
        animation: none !important;
      }

      .enter-copy {
        width: auto;
        padding: 0;
      }

      .entry-terminal-action {
        margin: 0;
        font-size: 16px;
      }

      .entry-play-button {
        width: 68px;
        height: 68px;
      }

      .entry-play-button::before {
        width: 17px;
        height: 21px;
      }
    }

    @media (max-width: 760px) and (pointer: coarse) {
      .entry-mobile-disclaimer {
        display: block;
        margin-top: 2px;
        font-size: 11px;
      }

      .tracklist-controls {
        display: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .scroll-hint::after,
      .scroll-direction-arrow {
        animation: none !important;
      }
    }

  </style>
</head>

<body>
  <div
    class="initial-buffer-screen"
    id="initialBufferScreen"
    role="status"
    aria-label="Loading site"
  >
    <span
      class="initial-buffer-spinner"
      aria-hidden="true"
    ></span>
  </div>

  <button
    class="enter-screen"
    id="enterScreen"
    type="button"
    disabled
    onpointerdown="primeSiteEntry()"
    onclick="enterSite()"
    aria-label="Click to enter the site"
  >
    <span class="enter-copy" aria-hidden="true">
      <span class="entry-terminal-action">
        click :3
      </span>
      <span class="entry-audio-note">
        this page contains audio
      </span>
      <span class="entry-mobile-disclaimer">
        view on pc for full site
      </span>
    </span>

    <span class="entry-lock" aria-hidden="true">
      <svg viewBox="0 0 48 48">
        <path
          class="entry-lock-shackle"
          d="M15 21v-5a9 9 0 0 1 18 0v5"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        ></path>
        <rect
          x="11"
          y="20"
          width="26"
          height="22"
          rx="4"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        ></rect>
        <circle cx="24" cy="30" r="1.75" fill="currentColor"></circle>
        <path
          d="M24 32v4"
          fill="none"
          stroke="currentColor"
          stroke-width="1.75"
          stroke-linecap="round"
        ></path>
      </svg>
    </span>
  </button>

  <main class="snap-container" id="snapContainer">
    <div class="snap-track" id="snapTrack">
    <section
      class="snap-page profile-page"
      id="profilePage"
      data-snap-page
    >
      <div
        class="profile-background-boot"
        id="profileBackgroundBoot"
        aria-hidden="true"
      ></div>

      <div class="banner" id="banner"></div>

      <div class="profile-content">
        <section class="profile">
          <div class="top-row">
            <img
              class="avatar"
              id="avatar"
              alt="Profile picture"
            >

            <div class="identity">
              <h1 id="name"></h1>
              <p class="bio" id="bio"></p>
            </div>
          </div>

        </section>
      </div>

    </section>

    <section
      class="snap-page module-page social-page"
      id="socialPage"
      data-snap-page
    >
      <div class="module-inner">
        <div class="page-kicker">02 / Socials</div>
        <div class="links" id="links"></div>
      </div>
    </section>

    <section
      class="snap-page module-page combined-page"
      id="modulesPage"
      data-snap-page
    >
      <div class="module-inner combined-module-inner">
        <div class="page-kicker">03 / Modules</div>
        <div class="combined-modules">
          <div class="combined-discord">
            <div class="discord-module" id="discordModule" hidden>
              <a
                class="discord-card"
                id="discordCard"
                href="index.html#"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Open Discord profile"
              >
                <span class="discord-avatar-wrap">
                  <img
                    class="discord-avatar"
                    id="discordAvatar"
                    alt=""
                  >
                  <span
                    class="discord-status"
                    id="discordStatus"
                    aria-label="Discord status"
                  ></span>
                </span>

                <span class="discord-text">
                  <span
                    class="discord-name"
                    id="discordName"
                  ></span>

                  <span
                    class="discord-username"
                    id="discordUsername"
                  ></span>
                </span>
              </a>
            </div>
          </div>

          <div class="combined-clock" id="clockModule">
            <div class="clock-layout">
              <div
                class="analog-clock"
                id="analogClock"
                aria-label="Analog clock"
              >
                <div id="clockTicks"></div>
                <span
                  class="clock-hand clock-hour-hand"
                  id="clockHourHand"
                ></span>
                <span
                  class="clock-hand clock-minute-hand"
                  id="clockMinuteHand"
                ></span>
                <span
                  class="clock-hand clock-second-hand"
                  id="clockSecondHand"
                ></span>
                <span class="clock-center-dot"></span>
              </div>

              <div class="clock-copy">
                <div class="clock-digital" id="clockDigital">
                  --:--
                  <span class="clock-meridiem">--</span>
                </div>
                <div class="clock-zone" id="clockZone">
                  America/Los_Angeles
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="tracklist-home" id="tracklistHome">
          <div class="tracklist-module" id="tracklistModule" hidden>
          <div class="tracklist-heading">Tracklist</div>

          <div class="tracklist" id="tracklist"></div>

          <div class="tracklist-controls">

            <label class="tracklist-volume">
              <span>volume</span>
              <input
                id="tracklistVolume"
                data-prevent-page-swipe
                type="range"
                min="0"
                max="1"
                step="0.01"
                value="0.5"
                oninput="setTracklistVolume(this.value)"
                onchange="setTracklistVolume(this.value)"
                ontouchstart="event.stopPropagation()"
                ontouchmove="event.stopPropagation(); setTracklistVolume(this.value)"
                ontouchend="event.stopPropagation(); setTracklistVolume(this.value)"
                aria-label="Track volume"
              >
            </label>
          </div>
        </div>
        </div>
      </div>
    </section>

    <section
      class="snap-page module-page gallery-page"
      id="galleryPage"
      data-snap-page
      hidden
    >
      <canvas
        class="gallery-bottom-visualizer"
        id="galleryBottomVisualizer"
        aria-hidden="true"
      ></canvas>

      <div class="module-inner gallery-module-inner">
        <div class="page-kicker">04 / Gallery</div>

        <div class="gallery-grid">
          <div class="gallery-slot">
            <div
              class="gallery-card"
              data-gallery-tilt
              tabindex="0"
              aria-label="Gallery image 1, art cred @aletiune"
            >
              <picture>
                <img
                  data-gallery-src="gal1.png"
                  alt="Gallery image 1"
                  decoding="async"
                  loading="lazy"
                  fetchpriority="low"
                  draggable="false"
                >
              </picture>
            </div>

            <span class="gallery-credit">
              art cred @aletiune
            </span>
          </div>

          <div class="gallery-slot">
            <div
              class="gallery-card"
              data-gallery-tilt
              tabindex="0"
              aria-label="Gallery image 2, art cred @aletiune"
            >
              <picture>
                <img
                  data-gallery-src="gal2.png"
                  alt="Gallery image 2"
                  decoding="async"
                  loading="lazy"
                  fetchpriority="low"
                  draggable="false"
                >
              </picture>
            </div>

            <span class="gallery-credit">
              art cred @aletiune
            </span>
          </div>
        </div>
      </div>
    </section>
    </div>
  </main>

  <aside
    class="desktop-tracklist-dock"
    id="desktopTracklistDock"
    hidden
    aria-label="Tracklist"
  ></aside>

  <nav class="page-indicator" aria-label="Page navigation">
    <button
      class="page-indicator-button active"
      type="button"
      data-page-target="profilePage"
      onclick="goToPageById('profilePage')"
      aria-label="Go to page 1"
    >01</button>

    <button
      class="page-indicator-button"
      type="button"
      data-page-target="socialPage"
      onclick="goToPageById('socialPage')"
      aria-label="Go to page 2"
    >02</button>

    <button
      class="page-indicator-button"
      id="modulesIndicator"
      type="button"
      data-page-target="modulesPage"
      onclick="goToPageById('modulesPage')"
      aria-label="Go to page 3"
    >03</button>

    <button
      class="page-indicator-button"
      id="galleryIndicator"
      type="button"
      data-page-target="galleryPage"
      onclick="goToPageById('galleryPage')"
      aria-label="Go to page 4"
      hidden
    >04</button>
  </nav>

  <div
    class="scroll-direction-indicator"
    id="scrollDirectionIndicator"
    hidden
    aria-hidden="true"
  >
    <span
      class="scroll-direction-arrow up is-hidden"
      id="scrollDirectionUp"
    ></span>

    <span>scroll</span>

    <span
      class="scroll-direction-arrow down"
      id="scrollDirectionDown"
    ></span>
  </div>

  <script>
    const builtInIcons = {
      discord: `
        <svg viewBox="0 0 24 24">
          <path d="M19.5 5.3A16 16 0 0 0 15.4 4l-.5 1.1a14 14 0 0 0-5.8 0L8.6 4a16 16 0 0 0-4.1 1.3C1.9 9.1 1.2 12.8 1.5 16.4A16.5 16.5 0 0 0 6.6 19l1.2-1.7a10.8 10.8 0 0 1-1.9-.9l.5-.4c3.6 1.7 7.6 1.7 11.2 0l.5.4a12 12 0 0 1-1.9.9l1.2 1.7a16.5 16.5 0 0 0 5.1-2.6c.4-4.1-.8-7.8-3-11.1ZM8.7 14.7c-1 0-1.9-1-1.9-2.2s.8-2.2 1.9-2.2c1.1 0 1.9 1 1.9 2.2s-.8 2.2-1.9 2.2Zm6.6 0c-1 0-1.9-1-1.9-2.2s.8-2.2 1.9-2.2c1.1 0 1.9 1 1.9 2.2s-.8 2.2-1.9 2.2Z"/>
        </svg>
      `,

      tiktok: `
        <svg viewBox="0 0 24 24">
          <path d="M16.7 3c.4 2.4 1.8 3.8 4.3 4v4c-1.7 0-3.1-.5-4.3-1.3v5.7c0 3.2-2.3 5.6-5.7 5.6-3.1 0-5.5-2.2-5.5-5.2 0-3.2 2.5-5.4 6.1-5.3v4c-1.3-.2-2.2.4-2.2 1.4 0 .9.7 1.4 1.6 1.4 1 0 1.8-.6 1.8-2V3h3.9z"/>
        </svg>
      `,

      x: `
        <svg viewBox="0 0 24 24">
          <path d="M13.8 10.5 21.1 2h-1.7l-6.3 7.3L8 2H2.2l7.7 11.1L2.2 22h1.7l6.8-7.8 5.4 7.8H22l-8.2-11.5z"/>
        </svg>
      `,

      github: `
        <svg viewBox="0 0 24 24">
          <path d="M12 2a10 10 0 0 0-3.2 19.5c.5.1.7-.2.7-.5v-1.8c-2.8.6-3.4-1.2-3.4-1.2-.5-1.2-1.1-1.5-1.1-1.5-.9-.6.1-.6.1-.6 1 0 1.6 1.1 1.6 1.1.9 1.6 2.4 1.1 3 .9.1-.7.4-1.1.7-1.4-2.3-.3-4.7-1.1-4.7-5a3.9 3.9 0 0 1 1.1-2.8c-.1-.3-.5-1.3.1-2.8 0 0 .9-.3 2.9 1.1a10 10 0 0 1 5.3 0c2-1.4 2.9-1.1 2.9-1.1.6 1.5.2 2.5.1 2.8a3.9 3.9 0 0 1 1.1 2.8c0 3.9-2.4 4.7-4.7 5 .4.3.7 1 .7 2V21c0 .3.2.6.7.5A10 10 0 0 0 12 2Z"/>
        </svg>
      `,

      link: `
        <svg viewBox="0 0 24 24">
          <path d="M10.6 13.4a1 1 0 0 1 0-1.4l2.8-2.8a1 1 0 1 1 1.4 1.4L12 13.4a1 1 0 0 1-1.4 0z"/>
          <path d="M9.2 17.7a5 5 0 0 1 0-7.1l1.4-1.4a1 1 0 1 1 1.4 1.4l-1.4 1.4a3 3 0 0 0 4.2 4.2l1.4-1.4a1 1 0 0 1 1.4 1.4l-1.4 1.4a5 5 0 0 1-7 0z"/>
        </svg>
      `
    };

    function createIcon(link) {
      const icon = document.createElement("span");
      icon.className = "icon";
      icon.style.setProperty(
        "--icon-color",
        link.iconColor || "inherit"
      );

      if (link.customIcon) {
        const mask = document.createElement("span");
        mask.className = "icon-mask";

        const iconUrl = `url("${link.customIcon}")`;

        mask.style.webkitMaskImage = iconUrl;
        mask.style.maskImage = iconUrl;

        icon.appendChild(mask);
      } else {
        const iconName = String(link.icon || "link").toLowerCase();
        icon.innerHTML = builtInIcons[iconName] || builtInIcons.link;
      }

      return icon;
    }

    const discordStatusColors = {
      online: "#23A55A",
      idle: "#F0B232",
      dnd: "#F23F43",
      offline: "#80848E"
    };

    const DISCORD_LIVE_REFRESH_INTERVAL = 30000;
    const DISCORD_SOCKET_RECONNECT_DELAY = 5000;

    let discordLiveRefreshTimer = 0;
    let discordLiveRequestId = 0;
    let discordLiveSocket = null;
    let discordLiveHeartbeatTimer = 0;
    let discordLiveReconnectTimer = 0;
    let activeDiscordUserId = "";
    let activeDiscordFallbackConfig = null;
    let discordLifecycleListenersBound = false;

    function getDiscordUserId(supplied = {}) {
      const configuredId = String(
        supplied.userId || ""
      ).trim();

      if (/^\d{17,20}$/.test(configuredId)) {
        return configuredId;
      }

      const profileUrl = String(
        supplied.profileUrl || ""
      );

      const profileMatch = profileUrl.match(
        /discord(?:app)?\.com\/users\/(\d{17,20})/i
      );

      if (profileMatch) {
        return profileMatch[1];
      }

      const looseMatch = profileUrl.match(
        /(\d{17,20})/
      );

      return looseMatch
        ? looseMatch[1]
        : "";
    }

    function getDefaultDiscordAvatarIndex(user) {
      const discriminator = String(
        user?.discriminator || ""
      );

      if (
        discriminator &&
        discriminator !== "0"
      ) {
        return (
          Number(discriminator) % 5
        );
      }

      try {
        return Number(
          (
            BigInt(String(user?.id || "0")) >>
            22n
          ) % 6n
        );
      } catch {
        return 0;
      }
    }

    function getDiscordAvatarUrl(user) {
      const userId = String(
        user?.id || ""
      );

      const avatarHash = String(
        user?.avatar || ""
      );

      if (userId && avatarHash) {
        const extension =
          avatarHash.startsWith("a_")
            ? "gif"
            : "png";

        return (
          "https://cdn.discordapp.com/avatars/" +
          `${userId}/${avatarHash}.${extension}` +
          `?size=256&v=${encodeURIComponent(avatarHash)}`
        );
      }

      return (
        "https://cdn.discordapp.com/embed/avatars/" +
        `${getDefaultDiscordAvatarIndex(user)}.png`
      );
    }

    function updateCombinedPageVisibility() {
      const page =
        document.getElementById("modulesPage");

      const indicator =
        document.getElementById("modulesIndicator");

      const discordModule =
        document.getElementById("discordModule");

      const clockModule =
        document.getElementById("clockModule");

      const tracklistModule =
        document.getElementById("tracklistModule");

      const shouldHide =
        discordModule.hidden &&
        clockModule.hidden &&
        tracklistModule.hidden;

      page.hidden = shouldHide;
      indicator.hidden = shouldHide;
      refreshSnapPages();
    }

    function renderDiscordModule(config) {
      const module =
        document.getElementById("discordModule");

      module.hidden = false;

      document.documentElement.style.setProperty(
        "--discord-card-background",
        config.backgroundColor
      );

      document.documentElement.style.setProperty(
        "--discord-name-color",
        config.nameColor
      );

      document.documentElement.style.setProperty(
        "--discord-username-color",
        config.usernameColor
      );

      const card =
        document.getElementById("discordCard");

      card.href = config.profileUrl || "#";

      const avatar =
        document.getElementById("discordAvatar");

      avatar.alt = config.displayName;

      avatar.onerror = null;

      if (config.avatar) {
        avatar.src = config.avatar;

        if (
          config.fallbackAvatar &&
          config.fallbackAvatar !== config.avatar
        ) {
          avatar.onerror = () => {
            avatar.onerror = null;
            avatar.src = config.fallbackAvatar;
          };
        }
      } else {
        avatar.removeAttribute("src");
      }

      document.getElementById(
        "discordName"
      ).textContent = config.displayName;

      document.getElementById(
        "discordUsername"
      ).textContent = config.username;

      const normalizedStatus = String(
        config.status || "offline"
      ).toLowerCase();

      const statusElement =
        document.getElementById("discordStatus");

      const statusColor =
        discordStatusColors[normalizedStatus] ||
        discordStatusColors.offline;

      statusElement.style.setProperty(
        "--discord-live-color",
        statusColor
      );

      statusElement.style.backgroundColor =
        statusColor;

      statusElement.setAttribute(
        "aria-label",
        `Discord status: ${normalizedStatus}`
      );

      updateCombinedPageVisibility();
      refreshSnapPages();
    }

    function getPresenceFromSocketPayload(
      payloadData,
      userId
    ) {
      if (
        !payloadData ||
        typeof payloadData !== "object"
      ) {
        return null;
      }

      if (payloadData.discord_user) {
        return payloadData;
      }

      const mappedPresence =
        payloadData[userId];

      if (
        mappedPresence &&
        typeof mappedPresence === "object"
      ) {
        return mappedPresence;
      }

      return null;
    }

    function applyLiveDiscordPresence(
      liveData,
      userId,
      fallbackConfig
    ) {
      if (
        !liveData?.discord_user ||
        !fallbackConfig
      ) {
        return;
      }

      const user = liveData.discord_user;
      const returnedUserId = String(
        user.id || liveData.user_id || ""
      );

      if (
        returnedUserId &&
        returnedUserId !== String(userId)
      ) {
        return;
      }

      const liveDisplayName =
        user.global_name ||
        user.display_name ||
        user.username ||
        fallbackConfig.displayName;

      const liveUsername =
        user.username
          ? `@${user.username}`
          : fallbackConfig.username;

      renderDiscordModule({
        ...fallbackConfig,

        profileUrl:
          `https://discord.com/users/${userId}`,

        displayName:
          liveDisplayName,

        username:
          liveUsername,

        avatar:
          getDiscordAvatarUrl(user),

        fallbackAvatar:
          fallbackConfig.avatar,

        status:
          liveData.discord_status ||
          fallbackConfig.status
      });
    }

    async function refreshLiveDiscordModule(
      userId,
      fallbackConfig
    ) {
      if (!userId || !fallbackConfig) {
        return;
      }

      const requestId =
        ++discordLiveRequestId;

      const controller =
        new AbortController();

      const timeout = setTimeout(() => {
        controller.abort();
      }, 7000);

      try {
        const response = await fetch(
          (
            `https://api.lanyard.rest/v1/users/${userId}` +
            `?refresh=${Date.now()}`
          ),
          {
            cache: "no-store",
            signal: controller.signal,
            headers: {
              "Accept": "application/json"
            }
          }
        );

        if (!response.ok) {
          throw new Error(
            `Discord profile request failed: ${response.status}`
          );
        }

        const payload = await response.json();

        if (
          requestId !== discordLiveRequestId ||
          !payload?.success
        ) {
          return;
        }

        applyLiveDiscordPresence(
          payload.data,
          userId,
          fallbackConfig
        );
      } catch (error) {
        if (error?.name !== "AbortError") {
          console.warn(
            "Could not refresh live Discord profile; using the configured fallback.",
            error
          );
        }
      } finally {
        clearTimeout(timeout);
      }
    }

    function clearDiscordSocketTimers() {
      clearInterval(
        discordLiveHeartbeatTimer
      );

      clearTimeout(
        discordLiveReconnectTimer
      );

      discordLiveHeartbeatTimer = 0;
      discordLiveReconnectTimer = 0;
    }

    function disconnectLiveDiscordSocket(
      allowReconnect = false
    ) {
      clearDiscordSocketTimers();

      const socket = discordLiveSocket;
      discordLiveSocket = null;

      if (!socket) {
        return;
      }

      socket.onopen = null;
      socket.onmessage = null;
      socket.onerror = null;

      if (!allowReconnect) {
        socket.onclose = null;
      }

      try {
        socket.close();
      } catch {
        // Socket may already be closed.
      }
    }

    function scheduleDiscordSocketReconnect() {
      clearTimeout(
        discordLiveReconnectTimer
      );

      if (
        !activeDiscordUserId ||
        !activeDiscordFallbackConfig ||
        document.hidden ||
        !navigator.onLine
      ) {
        return;
      }

      discordLiveReconnectTimer = setTimeout(
        () => {
          connectLiveDiscordSocket(
            activeDiscordUserId,
            activeDiscordFallbackConfig
          );
        },
        DISCORD_SOCKET_RECONNECT_DELAY
      );
    }

    function connectLiveDiscordSocket(
      userId,
      fallbackConfig
    ) {
      if (
        !userId ||
        !fallbackConfig ||
        document.hidden ||
        !navigator.onLine
      ) {
        return;
      }

      if (
        discordLiveSocket &&
        (
          discordLiveSocket.readyState ===
            WebSocket.OPEN ||
          discordLiveSocket.readyState ===
            WebSocket.CONNECTING
        )
      ) {
        return;
      }

      disconnectLiveDiscordSocket();

      let socket;

      try {
        socket = new WebSocket(
          "wss://api.lanyard.rest/socket"
        );
      } catch (error) {
        console.warn(
          "Could not open the Discord live socket.",
          error
        );

        scheduleDiscordSocketReconnect();
        return;
      }

      discordLiveSocket = socket;

      socket.onmessage = event => {
        let payload;

        try {
          payload = JSON.parse(event.data);
        } catch {
          return;
        }

        if (payload?.op === 1) {
          const heartbeatInterval = Math.max(
            1000,
            Number(
              payload?.d?.heartbeat_interval
            ) || 30000
          );

          clearInterval(
            discordLiveHeartbeatTimer
          );

          discordLiveHeartbeatTimer =
            setInterval(() => {
              if (
                socket.readyState ===
                WebSocket.OPEN
              ) {
                socket.send(
                  JSON.stringify({
                    op: 3,
                    d: null
                  })
                );
              }
            }, heartbeatInterval);

          socket.send(
            JSON.stringify({
              op: 2,
              d: {
                subscribe_to_id:
                  String(userId)
              }
            })
          );

          return;
        }

        if (
          payload?.op !== 0 ||
          (
            payload?.t !== "INIT_STATE" &&
            payload?.t !== "PRESENCE_UPDATE"
          )
        ) {
          return;
        }

        const presence =
          getPresenceFromSocketPayload(
            payload.d,
            String(userId)
          );

        applyLiveDiscordPresence(
          presence,
          userId,
          fallbackConfig
        );
      };

      socket.onerror = () => {
        try {
          socket.close();
        } catch {
          // Ignore close failures.
        }
      };

      socket.onclose = () => {
        clearInterval(
          discordLiveHeartbeatTimer
        );

        discordLiveHeartbeatTimer = 0;

        if (discordLiveSocket === socket) {
          discordLiveSocket = null;
        }

        scheduleDiscordSocketReconnect();
      };
    }

    function bindDiscordLifecycleListeners() {
      if (discordLifecycleListenersBound) {
        return;
      }

      discordLifecycleListenersBound = true;

      document.addEventListener(
        "visibilitychange",
        () => {
          if (
            document.hidden ||
            !activeDiscordUserId ||
            !activeDiscordFallbackConfig
          ) {
            return;
          }

          void refreshLiveDiscordModule(
            activeDiscordUserId,
            activeDiscordFallbackConfig
          );

          connectLiveDiscordSocket(
            activeDiscordUserId,
            activeDiscordFallbackConfig
          );
        }
      );

      window.addEventListener(
        "online",
        () => {
          if (
            !activeDiscordUserId ||
            !activeDiscordFallbackConfig
          ) {
            return;
          }

          void refreshLiveDiscordModule(
            activeDiscordUserId,
            activeDiscordFallbackConfig
          );

          connectLiveDiscordSocket(
            activeDiscordUserId,
            activeDiscordFallbackConfig
          );
        }
      );

      window.addEventListener(
        "pagehide",
        () => {
          disconnectLiveDiscordSocket();
        }
      );

      window.addEventListener(
        "pageshow",
        () => {
          if (
            !activeDiscordUserId ||
            !activeDiscordFallbackConfig
          ) {
            return;
          }

          void refreshLiveDiscordModule(
            activeDiscordUserId,
            activeDiscordFallbackConfig
          );

          connectLiveDiscordSocket(
            activeDiscordUserId,
            activeDiscordFallbackConfig
          );
        }
      );
    }

    function setupDiscordModule(data) {
      const supplied = data.discord || {};
      const userId =
        getDiscordUserId(supplied);

      const config = {
        enabled:
          supplied.enabled !== false,

        profileUrl:
          supplied.profileUrl ||
          (
            userId
              ? `https://discord.com/users/${userId}`
              : "#"
          ),

        displayName:
          supplied.displayName ||
          supplied.fallbackName ||
          data.name ||
          "yuta",

        username:
          supplied.username ||
          supplied.fallbackUsername ||
          "vgze",

        avatar:
          supplied.avatar ||
          supplied.fallbackAvatar ||
          data.avatar ||
          "",

        fallbackAvatar:
          supplied.avatar ||
          supplied.fallbackAvatar ||
          data.avatar ||
          "",

        status:
          supplied.status ||
          "offline",

        backgroundColor:
          supplied.backgroundColor ||
          "#111111",

        nameColor:
          supplied.nameColor ||
          "#7e8797",

        usernameColor:
          supplied.usernameColor ||
          "#a0aabc"
      };

      const module =
        document.getElementById("discordModule");

      clearInterval(
        discordLiveRefreshTimer
      );

      discordLiveRefreshTimer = 0;

      activeDiscordUserId = "";
      activeDiscordFallbackConfig = null;

      disconnectLiveDiscordSocket();

      if (!config.enabled) {
        module.hidden = true;
        updateCombinedPageVisibility();
        return;
      }

      renderDiscordModule(config);

      if (!userId) {
        console.warn(
          "Discord live updates need a valid Discord user ID."
        );
        return;
      }

      activeDiscordUserId = String(userId);
      activeDiscordFallbackConfig = config;

      bindDiscordLifecycleListeners();

      void refreshLiveDiscordModule(
        activeDiscordUserId,
        activeDiscordFallbackConfig
      );

      connectLiveDiscordSocket(
        activeDiscordUserId,
        activeDiscordFallbackConfig
      );

      discordLiveRefreshTimer = setInterval(
        () => {
          if (document.hidden) {
            return;
          }

          void refreshLiveDiscordModule(
            activeDiscordUserId,
            activeDiscordFallbackConfig
          );
        },
        DISCORD_LIVE_REFRESH_INTERVAL
      );
    }

    let clockTimer = null;
    let clockStopTimer = null;
    let activeClockConfig = null;
    let clockPartsFormatter = null;
    let clockDigitalFormatter = null;
    let clockZoneFormatter = null;

    const CLOCK_PAGE_TRANSITION_GRACE = 470;

    function buildClockTicks() {
      const container =
        document.getElementById("clockTicks");

      if (container.childElementCount) {
        return;
      }

      for (let index = 0; index < 60; index += 1) {
        const tick = document.createElement("span");
        tick.className =
          "clock-tick" +
          (index % 5 === 0 ? " major" : "");
        tick.style.setProperty(
          "--tick-angle",
          `${index * 6}deg`
        );
        container.appendChild(tick);
      }
    }

    function getZonedClockParts(date, timeZone) {
      const formatter =
        clockPartsFormatter ||
        new Intl.DateTimeFormat(
          "en-US",
          {
            timeZone,
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
            hourCycle: "h23"
          }
        );

      const parts = Object.fromEntries(
        formatter
          .formatToParts(date)
          .filter(part => part.type !== "literal")
          .map(part => [part.type, part.value])
      );

      return {
        hour: Number(parts.hour),
        minute: Number(parts.minute),
        second: Number(parts.second)
      };
    }

    function updateClock() {
      if (!activeClockConfig) {
        return;
      }

      const now = new Date();
      let parts;

      try {
        parts = getZonedClockParts(
          now,
          activeClockConfig.timeZone
        );
      } catch {
        parts = getZonedClockParts(
          now,
          "America/Los_Angeles"
        );
      }

      const smoothSecond =
        parts.second + now.getMilliseconds() / 1000;

      const smoothMinute =
        parts.minute + smoothSecond / 60;

      const smoothHour =
        (parts.hour % 12) + smoothMinute / 60;

      document.getElementById(
        "clockSecondHand"
      ).style.transform =
        `translateX(-50%) rotate(${smoothSecond * 6}deg)`;

      document.getElementById(
        "clockMinuteHand"
      ).style.transform =
        `translateX(-50%) rotate(${smoothMinute * 6}deg)`;

      document.getElementById(
        "clockHourHand"
      ).style.transform =
        `translateX(-50%) rotate(${smoothHour * 30}deg)`;

      const digitalFormatter =
        clockDigitalFormatter;

      const zoneFormatter =
        clockZoneFormatter;

      if (!digitalFormatter || !zoneFormatter) {
        return;
      }

      const zoneName =
        zoneFormatter
          .formatToParts(now)
          .find(part => part.type === "timeZoneName")
          ?.value || activeClockConfig.timeZone;

      const digitalParts =
        digitalFormatter.formatToParts(now);

      const digitalTime =
        digitalParts
          .filter(
            part => part.type !== "dayPeriod"
          )
          .map(part => part.value)
          .join("")
          .trim();

      const meridiem =
        digitalParts
          .find(
            part => part.type === "dayPeriod"
          )
          ?.value || "";

      const digitalElement =
        document.getElementById(
          "clockDigital"
        );

      digitalElement.replaceChildren(
        document.createTextNode(digitalTime)
      );

      if (meridiem) {
        const meridiemElement =
          document.createElement("span");

        meridiemElement.className =
          "clock-meridiem";

        meridiemElement.textContent =
          meridiem;

        digitalElement.appendChild(
          meridiemElement
        );
      }

      document.getElementById("clockZone").textContent =
        zoneName;
    }

    function setClockHandWillChange(value) {
      [
        "clockHourHand",
        "clockMinuteHand",
        "clockSecondHand"
      ].forEach(id => {
        const hand = document.getElementById(id);

        if (hand) {
          hand.style.willChange = value;
        }
      });
    }

    function stopClockUpdates(immediate = false) {
      clearTimeout(clockStopTimer);
      clockStopTimer = null;

      if (!clockTimer) {
        setClockHandWillChange("auto");
        return;
      }

      const stop = () => {
        clearInterval(clockTimer);
        clockTimer = null;
        setClockHandWillChange("auto");
      };

      if (immediate) {
        stop();
        return;
      }

      clockStopTimer = setTimeout(
        stop,
        CLOCK_PAGE_TRANSITION_GRACE
      );
    }

    function startClockUpdates() {
      clearTimeout(clockStopTimer);
      clockStopTimer = null;

      if (clockTimer || !activeClockConfig?.enabled) {
        return;
      }

      setClockHandWillChange("transform");
      updateClock();
      clockTimer = setInterval(updateClock, 100);
    }

    function syncClockLifecycle() {
      const module =
        document.getElementById("clockModule");

      const shouldRun =
        siteEntered &&
        !document.hidden &&
        activeClockConfig?.enabled &&
        module &&
        !module.hidden &&
        document.body.dataset.activePage ===
          "modulesPage";

      if (shouldRun) {
        startClockUpdates();
      } else {
        stopClockUpdates(document.hidden || !siteEntered);
      }
    }

    function setupClockModule(data) {
      const supplied = data.clock || {};

      activeClockConfig = {
        enabled: supplied.enabled !== false,
        city: supplied.city || "Los Angeles",
        timeZone:
          supplied.timeZone ||
          "America/Los_Angeles",
        hour12: supplied.hour12 !== false,
        faceColor: supplied.faceColor || "#f1f4f7",
        textColor: supplied.textColor || "#7c8596",
        secondaryColor:
          supplied.secondaryColor || "#a8b3c2",
        accentColor:
          supplied.accentColor || "#8892a3"
      };

      try {
        new Intl.DateTimeFormat(
          "en-US",
          { timeZone: activeClockConfig.timeZone }
        ).format(new Date());
      } catch {
        activeClockConfig.timeZone =
          "America/Los_Angeles";
      }

      const module =
        document.getElementById("clockModule");

      if (!activeClockConfig.enabled) {
        module.hidden = true;
        stopClockUpdates(true);
        updateCombinedPageVisibility();
        return;
      }

      module.hidden = false;
      updateCombinedPageVisibility();

      document.documentElement.style.setProperty(
        "--clock-face-color",
        activeClockConfig.faceColor
      );

      document.documentElement.style.setProperty(
        "--clock-text-color",
        activeClockConfig.textColor
      );

      document.documentElement.style.setProperty(
        "--clock-secondary-color",
        activeClockConfig.secondaryColor
      );

      document.documentElement.style.setProperty(
        "--clock-accent-color",
        activeClockConfig.accentColor
      );

      document.getElementById("clockZone").textContent =
        activeClockConfig.timeZone;

      clockPartsFormatter =
        new Intl.DateTimeFormat(
          "en-US",
          {
            timeZone: activeClockConfig.timeZone,
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
            hourCycle: "h23"
          }
        );

      clockDigitalFormatter =
        new Intl.DateTimeFormat(
          "en-US",
          {
            timeZone: activeClockConfig.timeZone,
            hour: "numeric",
            minute: "2-digit",
            second: "2-digit",
            hour12: activeClockConfig.hour12
          }
        );

      clockZoneFormatter =
        new Intl.DateTimeFormat(
          "en-US",
          {
            timeZone: activeClockConfig.timeZone,
            timeZoneName: "short"
          }
        );

      buildClockTicks();
      stopClockUpdates(true);
      updateClock();
      syncClockLifecycle();
      refreshSnapPages();
    }

    const trackAudio = new Audio();
    trackAudio.preload = "none";
    trackAudio.playsInline = true;
    trackAudio.loop = true;
    trackAudio.defaultPlaybackRate = 1;
    trackAudio.playbackRate = 1;
    trackAudio.preservesPitch = true;
    trackAudio.mozPreservesPitch = true;
    trackAudio.webkitPreservesPitch = true;

    const mobileStableAudioQuery =
      window.matchMedia(
        "(max-width: 1100px), (pointer: coarse)"
      );

    function useNativeMobileAudio() {
      return mobileStableAudioQuery.matches;
    }

    function normalizeTrackPlaybackRate() {
      if (trackAudio.defaultPlaybackRate !== 1) {
        trackAudio.defaultPlaybackRate = 1;
      }

      if (trackAudio.playbackRate !== 1) {
        trackAudio.playbackRate = 1;
      }

      trackAudio.preservesPitch = true;
      trackAudio.mozPreservesPitch = true;
      trackAudio.webkitPreservesPitch = true;
    }

    const ENTRY_UNLOCK_FALLBACK_DELAY = 820;
    const ENTRY_UNLOCK_BEEP_GAIN = 1.6;

    const unlockBeepAudio = new Audio("beep.mp3");
    unlockBeepAudio.preload = "auto";
    unlockBeepAudio.playsInline = true;

    let unlockAudioContext = null;
    let unlockBeepBuffer = null;
    let unlockBeepBufferPromise = null;
    let unlockBeepSource = null;
    let unlockBeepGainNode = null;
    let unlockBeepCompressor = null;

    function getUnlockAudioContext() {
      if (unlockAudioContext) {
        return unlockAudioContext;
      }

      const AudioContextClass =
        window.AudioContext ||
        window.webkitAudioContext;

      if (!AudioContextClass) {
        return null;
      }

      try {
        unlockAudioContext =
          new AudioContextClass({
            latencyHint: "interactive"
          });
      } catch {
        try {
          unlockAudioContext =
            new AudioContextClass();
        } catch {
          unlockAudioContext = null;
        }
      }

      return unlockAudioContext;
    }

    async function prepareUnlockBeepBuffer() {
      if (unlockBeepBuffer) {
        return unlockBeepBuffer;
      }

      if (unlockBeepBufferPromise) {
        return unlockBeepBufferPromise;
      }

      unlockBeepBufferPromise = (async () => {
        const context =
          getUnlockAudioContext();

        if (!context) {
          return null;
        }

        const response = await fetch(
          "beep.mp3",
          {
            cache: "force-cache"
          }
        );

        if (!response.ok) {
          throw new Error(
            "Could not fetch beep.mp3"
          );
        }

        const encodedAudio =
          await response.arrayBuffer();

        const decodedAudio =
          await context.decodeAudioData(
            encodedAudio.slice(0)
          );

        unlockBeepBuffer = decodedAudio;

        return decodedAudio;
      })().catch(error => {
        console.warn(
          "Could not prepare unlock beep buffer:",
          error
        );

        unlockBeepBufferPromise = null;

        return null;
      });

      return unlockBeepBufferPromise;
    }

    function primeUnlockAudioFromGesture() {
      const context =
        getUnlockAudioContext();

      if (
        context &&
        context.state === "suspended"
      ) {
        void context.resume();
      }

      void prepareUnlockBeepBuffer();

    function stopUnlockBeepSource() {
      try {
        unlockBeepSource?.stop();
      } catch {
        // The source may already have ended.
      }

      try {
        unlockBeepSource?.disconnect();
        unlockBeepGainNode?.disconnect();
        unlockBeepCompressor?.disconnect();
      } catch {
        // Nodes may already be disconnected.
      }

      unlockBeepSource = null;
      unlockBeepGainNode = null;
      unlockBeepCompressor = null;

      try {
        unlockBeepAudio.pause();
        unlockBeepAudio.currentTime = 0;
      } catch {
        // Ignore fallback audio cleanup errors.
      }
    }

    const interfaceSounds = {
      stop: new Audio("stop.mp3"),
      start: new Audio("start.mp3"),
      scroll: new Audio("scroll.mp3")
    };

    Object.values(interfaceSounds).forEach(audio => {
      audio.preload = "none";
      audio.playsInline = true;
    });

    let interfaceSoundContext = null;

    function getInterfaceSoundContext() {
      if (interfaceSoundContext) {
        return interfaceSoundContext;
      }

      const AudioContextClass =
        window.AudioContext ||
        window.webkitAudioContext;

      if (!AudioContextClass) {
        return null;
      }

      try {
        interfaceSoundContext =
          new AudioContextClass();
      } catch {
        interfaceSoundContext = null;
      }

      return interfaceSoundContext;
    }

    function playInterfaceSound(name) {
      const baseAudio = interfaceSounds[name];

      if (!baseAudio) {
        return;
      }

      try {
        const audio = baseAudio.cloneNode(true);

        const trackIsActivelyPlaying =
          activeTrackIndex >= 0 &&
          !trackAudio.paused &&
          !trackAudio.ended;

        const requestedGain =
          name === "scroll" &&
          trackIsActivelyPlaying
            ? 1.45
            : 1;

        audio.currentTime = 0;
        audio.volume = 1;
        audio.playsInline = true;

        let mediaSource = null;
        let gainNode = null;

        const releaseAudio = () => {
          try {
            mediaSource?.disconnect();
            gainNode?.disconnect();
          } catch {
            // Already disconnected.
          }

          audio.removeAttribute("src");
          audio.load();
        };

        audio.addEventListener(
          "ended",
          releaseAudio,
          { once: true }
        );

        audio.addEventListener(
          "error",
          releaseAudio,
          { once: true }
        );

        const context =
          requestedGain > 1
            ? getInterfaceSoundContext()
            : null;

        if (context) {
          mediaSource =
            context.createMediaElementSource(audio);

          gainNode = context.createGain();
          gainNode.gain.value = requestedGain;

          mediaSource.connect(gainNode);
          gainNode.connect(context.destination);

          if (context.state === "suspended") {
            void context.resume();
          }
        }

        const playPromise = audio.play();

        if (
          playPromise &&
          typeof playPromise.catch ===
            "function"
        ) {
          playPromise.catch(() => {
            releaseAudio();
          });
        }
      } catch {
        // Ignore unavailable optional UI sounds.
      }
    }

    function bindInterfaceHoverSounds() {
      const selector = [
        ".social-page .link",
        ".page-indicator-button",
        "#tracklist .track-row",
        ".gallery-card"
      ].join(",");

      const fineHoverQuery =
        window.matchMedia(
          "(hover: hover) and (pointer: fine)"
        );

      let hoverSoundsBlockedUntil =
        performance.now() + 600;

      const temporarilyBlockHoverSounds = () => {
        hoverSoundsBlockedUntil =
          performance.now() + 1200;
      };

      document.addEventListener(
        "visibilitychange",
        () => {
          if (!document.hidden) {
            temporarilyBlockHoverSounds();
          }
        }
      );

      window.addEventListener(
        "pageshow",
        temporarilyBlockHoverSounds
      );

      document.addEventListener(
        "pointerover",
        event => {
          if (
            !siteEntered ||
            document.hidden ||
            !event.isTrusted ||
            !fineHoverQuery.matches ||
            event.pointerType !== "mouse" ||
            event.buttons !== 0 ||
            performance.now() <
              hoverSoundsBlockedUntil
          ) {
            return;
          }

          const target =
            event.target.closest?.(selector);

          if (!target) {
            return;
          }

          const previous =
            event.relatedTarget;

          if (
            previous instanceof Node &&
            target.contains(previous)
          ) {
            return;
          }

          playInterfaceSound("scroll");
        }

    bindInterfaceHoverSounds();

    const isTikTokInAppBrowser =
      document.documentElement.classList.contains(
        "tiktok-inapp-browser"
      );

    let unlockBeepTimer = 0;
    let unlockBeepPlayed = false;
    let unlockAnimationStartHandler = null;
    let entryTrackReleaseTimer = 0;
    let entryTrackAnimationEndHandler = null;
    let entryTrackReleased = false;
    let siteEntryAudioPrimed = false;

    function primeFirstTrackForUnlock() {
      if (!firstTrackPreloadSource) {
        return;
      }

      try {
        // Preload only. Do not call play() here, even muted, because some
        // browsers can briefly expose the audio before the delayed start.
        trackAudio.pause();
        trackAudio.muted = false;
        trackAudio.currentTime = 0;
        trackAudio.preload = "auto";

        if (trackAudio.src !== firstTrackPreloadSource) {
          trackAudio.src = firstTrackPreloadSource;
        }

        trackAudio.load();
      } catch (error) {
        console.warn(
          "Could not preload entry track:",
          error
        );
      }
    }

    function releaseFirstTrackAtUnlock() {
      if (
        entryTrackReleased ||
        !firstTrackAutoStart
      ) {
        return;
      }

      entryTrackReleased = true;

      try {
        trackAudio.pause();
        trackAudio.currentTime = 0;
        trackAudio.muted = false;
        normalizeTrackPlaybackRate();

        // This is the first and only playback request for the entry track.
        const playPromise = firstTrackAutoStart();

        if (
          playPromise &&
          typeof playPromise.catch ===
            "function"
        ) {
          playPromise.catch(error => {
            console.warn(
              "Could not start entry track at unlock:",
              error
            );
          });
        }
      } catch (error) {
        console.warn(
          "Could not start entry track at unlock:",
          error
        );
      }
    }

    function scheduleFirstTrackRelease() {
      clearTimeout(entryTrackReleaseTimer);

      if (!isTikTokInAppBrowser) {
        releaseFirstTrackAtUnlock();
        return;
      }

      const shackle =
        document.querySelector(
          ".entry-lock-shackle"
        );

      if (
        shackle &&
        entryTrackAnimationEndHandler
      ) {
        shackle.removeEventListener(
          "animationend",
          entryTrackAnimationEndHandler
        );
      }

      entryTrackAnimationEndHandler =
        event => {
          if (
            event.animationName !==
            "entryLockShackleRelease"
          ) {
            return;
          }

          shackle?.removeEventListener(
            "animationend",
            entryTrackAnimationEndHandler
          );

          entryTrackAnimationEndHandler =
            null;

            entryTrackReleaseTimer

          // the shackle completes before starting media.

            window.setTimeout(
              releaseFirstTrackAtUnlock,
              80

        "animationend",
        entryTrackAnimationEndHandler

      entryTrackReleaseTimer =
        window.setTimeout(
          releaseFirstTrackAtUnlock,
          900
        );
    }

    function playUnlockAudioOnce() {

        return;

      clearTimeout(unlockBeepTimer);

      stopUnlockBeepSource();

      const context =
        getUnlockAudioContext();

      if (
        context &&
        unlockBeepBuffer
