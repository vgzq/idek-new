        return;
      }

      // Fallback for browsers without Web Audio decoding.
      try {
        unlockBeepAudio.pause();
        unlockBeepAudio.currentTime = 0;
        unlockBeepAudio.loop = false;
        unlockBeepAudio.muted = false;
        unlockBeepAudio.volume = 1;

        const playPromise =
          unlockBeepAudio.play();

        if (
          playPromise &&
          typeof playPromise.catch ===
            "function"
        ) {
          playPromise.catch(error => {
            console.warn(
              "Could not play fallback unlock beep:",
              error
            );
          });
        }
      } catch (error) {
        console.warn(
          "Could not start fallback unlock beep:",
          error
        );
      }
    }

    function scheduleUnlockBeep() {
      clearTimeout(unlockBeepTimer);
      unlockBeepPlayed = false;

      primeUnlockAudioFromGesture();

      const shackle =
        document.querySelector(
          ".entry-lock-shackle"
        );

      if (
        shackle &&
        unlockAnimationStartHandler
      ) {
        shackle.removeEventListener(
          "animationstart",
          unlockAnimationStartHandler
        );
      }

      unlockAnimationStartHandler = event => {
        if (
          event.animationName !==
          "entryLockShackleRelease"
        ) {
          return;
        }

        shackle?.removeEventListener(
          "animationstart",
          unlockAnimationStartHandler
        );

        unlockAnimationStartHandler =
          null;

        // This fires when the browser actually begins moving the
        // shackle, so audio stays synchronized even after a slow frame.
        playUnlockAudioOnce();
      };

      shackle?.addEventListener(
        "animationstart",
        unlockAnimationStartHandler
      );

      // Fallback only. The once-guard prevents duplicate playback.
      unlockBeepTimer = window.setTimeout(
        playUnlockAudioOnce,
        ENTRY_UNLOCK_FALLBACK_DELAY
      );
    }

    let trackAudioContext = null;
    let trackMediaSource = null;
    let trackGainNode = null;
    let trackMasterGainNode = null;
    let trackAnalyserNode = null;
    let trackFrequencyData = null;
    let trackVolumeLevel = 0.5;
    let activeTrackVolume = 0.5;

    const TRACK_PAUSE_FADE_DURATION = 320;
    const TRACK_RESUME_FADE_DURATION = 360;

    let trackVolumeFadeFrame = 0;
    let trackVolumeFadeResolve = null;

    function cancelTrackVolumeFade() {
      if (trackVolumeFadeFrame) {
        cancelAnimationFrame(trackVolumeFadeFrame);
        trackVolumeFadeFrame = 0;
      }

      if (trackVolumeFadeResolve) {
        const resolve = trackVolumeFadeResolve;
        trackVolumeFadeResolve = null;
        resolve(false);
      }
    }

    function getTrackElementPlaybackVolume() {
      return trackAudioContext
        ? 1
        : getFallbackTrackVolume();
    }

    function setTrackElementVolume(value) {
      trackAudio.volume = Math.min(
        1,
        Math.max(0, Number(value) || 0)
      );
    }

    function fadeTrackElementVolume(
      target,
      duration
    ) {
      cancelTrackVolumeFade();

      const startVolume = trackAudio.volume;
      const endVolume = Math.min(
        1,
        Math.max(0, Number(target) || 0)
      );
      const fadeDuration = Math.max(
        1,
        Number(duration) || 1
      );
      const startedAt = performance.now();

      return new Promise(resolve => {
        trackVolumeFadeResolve = resolve;

        const step = now => {
          const progress = Math.min(
            1,
            (now - startedAt) / fadeDuration
          );

          const eased =
            progress < 0.5
              ? 2 * progress * progress
              : 1 -
                Math.pow(
                  -2 * progress + 2,
                  2
                ) / 2;

          setTrackElementVolume(
            startVolume +
              (endVolume - startVolume) *
                eased
          );

          if (progress < 1) {
            trackVolumeFadeFrame =
              requestAnimationFrame(step);
            return;
          }

          trackVolumeFadeFrame = 0;
          trackVolumeFadeResolve = null;
          setTrackElementVolume(endVolume);
          resolve(true);
        };

        trackVolumeFadeFrame =
          requestAnimationFrame(step);
      });
    }

    function initializeTrackAudioOutput() {
      normalizeTrackPlaybackRate();

      if (useNativeMobileAudio()) {
        trackAudio.volume =
          getFallbackTrackVolume();
        return;
      }

      const AudioContextClass =
        window.AudioContext ||
        window.webkitAudioContext;

      if (!AudioContextClass) {
        trackAudio.volume =
          getFallbackTrackVolume();
        return;
      }

      try {
        if (!trackAudioContext) {
          trackAudioContext =
            new AudioContextClass();

          trackMediaSource =
            trackAudioContext.createMediaElementSource(
              trackAudio
            );

          trackGainNode =
            trackAudioContext.createGain();

          trackMasterGainNode =
            trackAudioContext.createGain();

          trackAnalyserNode =
            trackAudioContext.createAnalyser();

          trackAnalyserNode.fftSize = 2048;
          trackAnalyserNode.smoothingTimeConstant = 0.70;
          trackAnalyserNode.minDecibels = -92;
          trackAnalyserNode.maxDecibels = -18;

          trackFrequencyData =
            new Uint8Array(
              trackAnalyserNode.frequencyBinCount
            );

          trackMediaSource.connect(trackGainNode);
          trackGainNode.connect(trackMasterGainNode);
          trackMasterGainNode.connect(
            trackAnalyserNode
          );

          trackAnalyserNode.connect(
            trackAudioContext.destination
          );
        }

        trackAudio.volume = 1;

        if (
          trackGainNode &&
          trackMasterGainNode
        ) {
          trackGainNode.gain.value =
            getTrackSourceGain();

          trackMasterGainNode.gain.value =
            trackVolumeLevel;
        }

        if (
          trackAudioContext.state === "suspended"
        ) {
          trackAudioContext.resume().catch(
            error => {
              console.error(
                "Could not resume audio output:",
                error
              );
            }
          );
        }
      } catch (error) {
        console.error(
          "Could not initialize audio output:",
          error
        );

        trackAudio.volume =
          getFallbackTrackVolume();
      }
    }

    let activeTrackIndex = -1;
    let activeTrackRow = null;
    let activeTrackButton = null;
    let activeTrackProgress = null;
    let firstTrackAutoStart = null;
    let firstTrackPreloadSource = "";
    let trackPlaybackRequestId = 0;
    let trackPlaylist = [];

    let mobileReturnShouldResume = false;
    let mobileReturnTrackIndex = -1;
    let mobileReturnTrackSource = "";
    let mobileReturnTrackTime = 0;
    let mobileReturnResumeTimer = 0;

    function pauseTrackForMobileNavigation() {
      if (
        !useNativeMobileAudio() ||
        mobileReturnShouldResume ||
        activeTrackIndex < 0 ||
        trackAudio.paused ||
        trackAudio.ended
      ) {
        return;
      }

      mobileReturnShouldResume = true;
      mobileReturnTrackIndex =
        activeTrackIndex;
      mobileReturnTrackSource =
        trackAudio.currentSrc ||
        trackAudio.src ||
        "";
      mobileReturnTrackTime =
        Number.isFinite(trackAudio.currentTime)
          ? trackAudio.currentTime
          : 0;

      clearTimeout(mobileReturnResumeTimer);
      cancelTrackVolumeFade();
      normalizeTrackPlaybackRate();
      trackAudio.pause();
    }

    function resumeTrackAfterMobileNavigation() {
      if (
        !useNativeMobileAudio() ||
        !mobileReturnShouldResume
      ) {
        return;
      }

      clearTimeout(mobileReturnResumeTimer);

      mobileReturnResumeTimer =
        window.setTimeout(async () => {
          if (
            !mobileReturnShouldResume ||
            document.hidden ||
            activeTrackIndex !==
              mobileReturnTrackIndex ||
            activeTrackIndex < 0
          ) {
            return;
          }

          const currentSource =
            trackAudio.currentSrc ||
            trackAudio.src ||
            "";

          if (
            mobileReturnTrackSource &&
            currentSource &&
            currentSource !==
              mobileReturnTrackSource
          ) {
            mobileReturnShouldResume = false;
            return;
          }

          const savedTime =
            mobileReturnTrackTime;

          mobileReturnShouldResume = false;
          normalizeTrackPlaybackRate();
          cancelTrackVolumeFade();
          setTrackElementVolume(0);

          try {
            if (
              Number.isFinite(savedTime) &&
              savedTime >= 0 &&
              Math.abs(
                (trackAudio.currentTime || 0) -
                savedTime
              ) > 0.12
            ) {
              trackAudio.currentTime =
                Number.isFinite(
                  trackAudio.duration
                ) &&
                trackAudio.duration > 0
                  ? Math.min(
                      savedTime,
                      Math.max(
                        0,
                        trackAudio.duration - 0.05
                      )
                    )
                  : savedTime;
            }

            const playPromise =
              trackAudio.play();

            if (playPromise) {
              await playPromise;
            }

            normalizeTrackPlaybackRate();

            if (activeTrackRow) {
              activeTrackRow.classList.add(
                "active"
              );

              activeTrackRow.classList.remove(
                "is-paused"
              );
            }

            if (activeTrackButton) {
              activeTrackButton.removeAttribute(
                "aria-busy"
              );

              activeTrackButton.setAttribute(
                "aria-label",
                "Pause track"
              );
            }

            void fadeTrackElementVolume(
              getTrackElementPlaybackVolume(),
              260
            );
          } catch (error) {
            setTrackElementVolume(
              getTrackElementPlaybackVolume()
            );

            console.warn(
              "Could not automatically resume mobile audio:",
              error
            );
          }
        }, 280);
    }

    document.addEventListener(
      "visibilitychange",
      () => {
        if (document.hidden) {
          pauseTrackForMobileNavigation();
        } else {
          resumeTrackAfterMobileNavigation();
        }
      }
    );

    window.addEventListener(
      "pagehide",
      pauseTrackForMobileNavigation
    );

    window.addEventListener(
      "pageshow",
      resumeTrackAfterMobileNavigation
    );

    trackAudio.addEventListener(
      "ratechange",
      () => {
        if (
          useNativeMobileAudio() &&
          (
            trackAudio.playbackRate !== 1 ||
            trackAudio.defaultPlaybackRate !== 1
          )
        ) {
          normalizeTrackPlaybackRate();
        }
      }
    );

    function clearTrackVisualStates(
      preserveProgressRow = null
    ) {
      document
        .querySelectorAll("#tracklist .track-row")
        .forEach(trackRow => {
          trackRow.classList.remove(
            "active",
            "is-paused"
          );

          trackRow.removeAttribute("aria-busy");

          const fill = trackRow.querySelector(
            ".track-row-progress-fill"
          );

          if (
            fill &&
            trackRow !== preserveProgressRow
          ) {
            fill.style.width = "0%";
          }
        });
    }

    function resetActiveTrack(
      resetTime = true,
      invalidatePending = true
    ) {
      if (invalidatePending) {
        trackPlaybackRequestId += 1;
      }

      clearTrackVisualStates();
      if (activeTrackButton) {
        activeTrackButton.setAttribute(
          "aria-label",
          "Play track"
        );
      }

      if (resetTime) {
        try {
          trackAudio.currentTime = 0;
        } catch {
          // Audio may not have loaded yet.
        }
      }

      activeTrackIndex = -1;
      activeTrackRow = null;
      activeTrackButton = null;
      activeTrackProgress = null;
      updateTracklistControls();
      updateTracklistProgressControl();
    }

    function pauseActiveTrack() {
      trackAudio.pause();

      if (activeTrackButton) {
        activeTrackButton.removeAttribute("aria-busy");
        activeTrackButton.setAttribute(
          "aria-label",
          "Resume track"
        );
      }

      if (activeTrackRow) {
        activeTrackRow.classList.add(
          "active",
          "is-paused"
        );
      }

      updateTracklistControls();
    }

    function updateTracklistControls() {
      const hasTrack =
        activeTrackIndex >= 0 &&
        Boolean(trackAudio.src);

      if (activeTrackRow && hasTrack) {
        activeTrackRow.classList.add("active");
        activeTrackRow.classList.toggle(
          "is-paused",
          trackAudio.paused
        );
      }
    }

    function formatTrackTime(value) {
      const totalSeconds = Number.isFinite(value)
        ? Math.max(0, Math.floor(value))
        : 0;

      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor(
        (totalSeconds % 3600) / 60
      );
      const seconds = totalSeconds % 60;

      if (hours > 0) {
        return `${hours}:${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
      }

      return `${minutes}:${String(seconds).padStart(2, "0")}`;
    }

    function updateTracklistProgressControl() {
      const seekInput =
        document.getElementById("tracklistSeek");
      const currentLabel =
        document.getElementById(
          "tracklistCurrentTime"
        );
      const durationLabel =
        document.getElementById(
          "tracklistDurationTime"
        );

      const duration =
        Number.isFinite(trackAudio.duration) &&
        trackAudio.duration > 0
          ? trackAudio.duration
          : 0;

      const currentTime = duration
        ? Math.min(
            duration,
            Math.max(0, trackAudio.currentTime || 0)
          )
        : 0;

      const percentage = duration
        ? (currentTime / duration) * 100
        : 0;

      if (seekInput) {
        seekInput.max = String(duration);
        seekInput.value = String(currentTime);
        seekInput.disabled =
          activeTrackIndex < 0 || !duration;
        seekInput.style.setProperty(
          "--track-progress",
          `${Math.min(100, Math.max(0, percentage))}%`
        );
      }

      if (currentLabel) {
        currentLabel.textContent =
          formatTrackTime(currentTime);
      }

      if (durationLabel) {
        durationLabel.textContent =
          formatTrackTime(duration);
      }
    }

    function seekTracklist(value) {
      const duration = trackAudio.duration;
      const requestedTime = Number(value);

      if (
        activeTrackIndex < 0 ||
        !Number.isFinite(duration) ||
        duration <= 0 ||
        !Number.isFinite(requestedTime)
      ) {
        return;
      }

      trackAudio.currentTime = Math.min(
        duration,
        Math.max(0, requestedTime)
      );

      updateTracklistProgressControl();
    }

    function getNextTrackItem(afterIndex) {
      return trackPlaylist.find(item =>
        item.index > afterIndex && item.source
      );
    }

    async function playNextTrack(afterIndex) {
      const nextTrack =
        getNextTrackItem(afterIndex);

      resetActiveTrack();

      if (!nextTrack) {
        return;
      }

      await toggleTrack(
        nextTrack.index,
        nextTrack.source,
        nextTrack.volume,
        nextTrack.row,
        nextTrack.button,
        nextTrack.progress
      );
    }

    function normalizeTrackVolume(
      value,
      fallback = 0.5
    ) {
      const parsed = Number(value);

      return Number.isFinite(parsed)
        ? Math.min(1, Math.max(0, parsed))
        : fallback;
    }

    function getTrackSourceGain() {
      return Math.min(
        2,
        Math.max(
          0,
          activeTrackVolume / 0.5
        )
      );
    }

    function getTrackMasterGain() {
      // The visible site's 50% position is neutral:
      // 50% = the exact loudness chosen in the editor.
      // Below 50% lowers it; above 50% boosts it.
      return Math.min(
        2,
        Math.max(
          0,
          trackVolumeLevel / 0.5
        )
      );
    }

    function getFallbackTrackVolume() {
      return Math.min(
        1,
        Math.max(
          0,
          getTrackMasterGain() *
            getTrackSourceGain()
        )
      );
    }

    function applyTrackOutputVolume() {
      if (
        trackGainNode &&
        trackMasterGainNode &&
        trackAudioContext
      ) {
        const now =
          trackAudioContext.currentTime;

        trackGainNode.gain.cancelScheduledValues(
          now
        );

        trackMasterGainNode.gain.cancelScheduledValues(
          now
        );

        trackGainNode.gain.setTargetAtTime(
          getTrackSourceGain(),
          now,
          0.015
        );

        trackMasterGainNode.gain.setTargetAtTime(
          getTrackMasterGain(),
          now,
          0.015
        );

        trackAudio.volume = 1;
      } else {
        trackAudio.volume =
          getFallbackTrackVolume();
      }
    }

    function setTracklistVolume(value) {
      trackVolumeLevel =
        normalizeTrackVolume(value, 0.5);

      applyTrackOutputVolume();
    }

    function resolveAudioSource(source) {
      const value = String(source || "").trim();

      if (!value) {
        return "";
      }

      if (
        value.startsWith("blob:") ||
        value.startsWith("data:")
      ) {
        return value;
      }

      try {
        return new URL(value, window.location.href).href;
      } catch {
        return value;
      }
    }

    function waitForAudioReady(audio, timeout = 5000) {
      if (audio.readyState >= 2) {
        return Promise.resolve();
      }

      return new Promise((resolve, reject) => {
        let timer = null;

        const cleanup = () => {
          clearTimeout(timer);
          audio.removeEventListener("canplay", ready);
          audio.removeEventListener("loadeddata", ready);
          audio.removeEventListener("error", failed);
        };

        const ready = () => {
          cleanup();
          resolve();
        };

        const failed = () => {
          cleanup();
          reject(
            audio.error ||
            new Error("The audio file could not be loaded.")
          );
        };

        timer = setTimeout(() => {
          cleanup();
          reject(
            new Error("The audio file took too long to load.")
          );
        }, timeout);

        audio.addEventListener("canplay", ready, {
          once: true
        });

        audio.addEventListener("loadeddata", ready, {
          once: true
        });

        audio.addEventListener("error", failed, {
          once: true
        });
      });
    }

    async function startTrackPlayback(
      source,
      row,
      button,
      requestId
    ) {
      const resolvedSource =
        resolveAudioSource(source);

      if (!resolvedSource) {
        return false;
      }

      button.setAttribute("aria-busy", "true");
      button.setAttribute(
        "aria-label",
        "Loading track"
      );

      trackAudio.pause();

      if (trackAudio.src !== resolvedSource) {
        trackAudio.src = resolvedSource;
        trackAudio.load();
      }

      updateTracklistProgressControl();

      try {
        trackAudio.muted = false;
        normalizeTrackPlaybackRate();

        const playPromise = trackAudio.play();

        if (playPromise) {
          await playPromise;
        }

        if (
          requestId !== trackPlaybackRequestId ||
          activeTrackRow !== row ||
          activeTrackButton !== button
        ) {
          button.removeAttribute("aria-busy");
          return null;
        }

        row.classList.add("active");
        row.classList.remove("is-paused");
        button.removeAttribute("aria-busy");
        button.setAttribute(
          "aria-label",
          "Pause track"
        );

        return true;
      } catch (error) {
        if (
          requestId !== trackPlaybackRequestId ||
          activeTrackRow !== row ||
          activeTrackButton !== button
        ) {
          button.removeAttribute("aria-busy");
          return null;
        }

        console.error(
          "Could not play audio:",
          resolvedSource,
          error
        );

        row.classList.remove("active");
        button.removeAttribute("aria-busy");
        button.setAttribute(
          "aria-label",
          "Audio file could not be played"
        );

        return false;
      }
    }

    async function toggleTrack(
      index,
      source,
      trackVolume,
      row,
      button,
      progress,
      userInitiated = false
    ) {
      if (!source) {
        return;
      }

      if (
        userInitiated &&
        (
          activeTrackIndex !== index ||
          trackAudio.paused
        )
      ) {
        playInterfaceSound("start");
      }

      const requestId =
        ++trackPlaybackRequestId;

      if (activeTrackIndex === index) {
        if (trackAudio.paused) {
          button.setAttribute("aria-busy", "true");
          button.setAttribute(
            "aria-label",
            "Loading track"
          );

          cancelTrackVolumeFade();
          setTrackElementVolume(0);

          try {
            normalizeTrackPlaybackRate();

            const playPromise = trackAudio.play();

            if (playPromise) {
              await playPromise;
            }

            if (
              requestId !== trackPlaybackRequestId ||
              activeTrackIndex !== index ||
              activeTrackRow !== row
            ) {
              button.removeAttribute("aria-busy");
              return;
            }

            clearTrackVisualStates(row);
            row.classList.add("active");
            row.classList.remove("is-paused");
            button.removeAttribute("aria-busy");

            button.setAttribute(
              "aria-label",
              "Pause track"
            );

            void fadeTrackElementVolume(
              getTrackElementPlaybackVolume(),
              TRACK_RESUME_FADE_DURATION
            );

          } catch (error) {
            if (
              requestId === trackPlaybackRequestId
            ) {
              console.error(
                "Could not resume track:",
                error
              );

              button.removeAttribute("aria-busy");
              setTrackElementVolume(
                getTrackElementPlaybackVolume()
              );
              button.setAttribute(
                "aria-label",
                "Audio file could not be played"
              );
            } else {
              button.removeAttribute("aria-busy");
            }
          }
        } else {
          playInterfaceSound("stop");

          const fadeCompleted =
            await fadeTrackElementVolume(
              0,
              TRACK_PAUSE_FADE_DURATION
            );

          if (
            !fadeCompleted ||
            requestId !== trackPlaybackRequestId ||
            activeTrackIndex !== index ||
            activeTrackRow !== row
          ) {
            return;
          }

          pauseActiveTrack();
        }

        return;
      }

      cancelTrackVolumeFade();
      trackAudio.pause();
      resetActiveTrack(false, false);

      activeTrackIndex = index;
      activeTrackRow = row;
      activeTrackButton = button;
      activeTrackProgress = progress;
      activeTrackVolume =
        normalizeTrackVolume(
          trackVolume,
          0.5
        );

      applyTrackOutputVolume();
      setTrackElementVolume(
        getTrackElementPlaybackVolume()
      );
      clearTrackVisualStates();

      const started = await startTrackPlayback(
        source,
        row,
        button,
        requestId
      );

      if (
        requestId !== trackPlaybackRequestId
      ) {
        return;
      }

      if (started === false) {
        resetActiveTrack();
        return;
      }

    }

    trackAudio.addEventListener(
      "play",
      updateTracklistControls
    );

    trackAudio.addEventListener(
      "pause",
      updateTracklistControls
    );

    trackAudio.addEventListener("timeupdate", () => {
      if (
        activeTrackProgress &&
        Number.isFinite(trackAudio.duration) &&
        trackAudio.duration > 0
      ) {
        const percentage =
          (trackAudio.currentTime /
            trackAudio.duration) * 100;

        activeTrackProgress.style.width =
          `${Math.min(100, Math.max(0, percentage))}%`;
      }

      updateTracklistProgressControl();
    });

    trackAudio.addEventListener(
      "loadedmetadata",
      updateTracklistProgressControl
    );

    trackAudio.addEventListener(
      "durationchange",
      updateTracklistProgressControl
    );

    trackAudio.addEventListener("ended", () => {
      if (activeTrackIndex < 0) {
        return;
      }

      trackAudio.currentTime = 0;
      normalizeTrackPlaybackRate();

      const replayPromise = trackAudio.play();

      if (replayPromise) {
        replayPromise.catch(error => {
          console.error(
            "Could not loop track:",
            error
          );
        });
      }
    });

    let trackTitleResizeObserver = null;

    function updateTrackTitleMarquee(
      titleElement,
      retryCount = 0
    ) {
      if (
        !titleElement ||
        titleElement.hidden ||
        !titleElement.textContent.trim()
      ) {
        return;
      }

      const textElement =
        titleElement.querySelector(
          ".track-title-text"
        );

      if (!textElement) {
        return;
      }

      titleElement.classList.remove(
        "is-overflowing"
      );

      titleElement.style.removeProperty(
        "--track-title-distance"
      );

      titleElement.style.removeProperty(
        "--track-title-duration"
      );

      // Restart the animation after recalculating it.
      textElement.style.animation = "none";
      void textElement.offsetWidth;
      textElement.style.removeProperty("animation");

      const containerWidth =
        titleElement.getBoundingClientRect().width;

      const textWidth =
        textElement.getBoundingClientRect().width;

      // The title may be measured before the dock/layout is visible.
      if (
        (containerWidth <= 1 || textWidth <= 1) &&
        retryCount < 5
      ) {
        setTimeout(() => {
          updateTrackTitleMarquee(
            titleElement,
            retryCount + 1
          );
        }, 120);

        return;
      }

      const overflow =
        Math.ceil(textWidth - containerWidth);

      if (overflow <= 2) {
        return;
      }

      const distance = overflow + 12;

      const duration = Math.max(
        6,
        Math.min(
          15,
          5.2 + distance / 22
        )
      );

      titleElement.style.setProperty(
        "--track-title-distance",
        `${distance}px`
      );

      titleElement.style.setProperty(
        "--track-title-duration",
        `${duration.toFixed(2)}s`
      );

      titleElement.classList.add(
        "is-overflowing"
      );
    }

    function refreshTrackTitleMarquees() {
      document
        .querySelectorAll(".track-title")
        .forEach(titleElement => {
          updateTrackTitleMarquee(
            titleElement
          );
        });
    }

    function scheduleTrackTitleMarqueeRefresh() {
      requestAnimationFrame(() => {
        refreshTrackTitleMarquees();

        setTimeout(
          refreshTrackTitleMarquees,
          120
        );

        setTimeout(
          refreshTrackTitleMarquees,
          500
        );
      });
    }

    function observeTrackTitleWidths() {
      if (
        typeof ResizeObserver !== "function"
      ) {
        return;
      }

      if (trackTitleResizeObserver) {
        trackTitleResizeObserver.disconnect();
      }

      trackTitleResizeObserver =
        new ResizeObserver(entries => {
          entries.forEach(entry => {
            updateTrackTitleMarquee(
              entry.target
            );
          });
        });

      document
        .querySelectorAll(".track-title")
        .forEach(titleElement => {
          trackTitleResizeObserver.observe(
            titleElement
          );
        });
    }

    function setupTracklist(data) {
      const supplied = data.tracklist || {};
      const module =
        document.getElementById("tracklistModule");
      const container =
        document.getElementById("tracklist");

      const tracks = Array.isArray(supplied.tracks)
        ? supplied.tracks
        : [];

      const enabled =
        supplied.enabled !== false &&
        tracks.length > 0;

      module.hidden = !enabled;
      module.classList.remove(
        "sequence-active"
      );

      container.innerHTML = "";

      tracklistSequenceDesktopPlayed = false;
      tracklistSequenceMobilePlayed = false;

      clearTimeout(tracklistSequenceMobileTimer);
      tracklistSequenceMobileTimer = 0;

      firstTrackAutoStart = null;
      firstTrackPreloadSource = "";
      trackPlaylist = [];

      trackAudio.pause();
      trackAudio.preload = "none";
      trackAudio.removeAttribute("src");
      trackAudio.load();

      resetActiveTrack();

      trackVolumeLevel =
        normalizeTrackVolume(
          supplied.defaultVolume,
          0.5
        );

      activeTrackVolume = 0.5;

      const volumeInput =
        document.getElementById(
          "tracklistVolume"
        );

      if (volumeInput) {
        volumeInput.value =
          String(trackVolumeLevel);
      }

      applyTrackOutputVolume();

      document.documentElement.style.setProperty(
        "--track-text-color",
        supplied.textColor ||
        data.clock?.textColor ||
        "#F1F1F1"
      );

      document.documentElement.style.setProperty(
        "--track-secondary-color",
        supplied.secondaryColor ||
        data.clock?.secondaryColor ||
        "#777777"
      );

      document.documentElement.style.setProperty(
        "--track-accent-color",
        supplied.accentColor ||
        data.clock?.accentColor ||
        "#707070"
      );

      refreshGalleryVisualizerAccent();

      if (!enabled) {
        updateDesktopTracklistPlacement();
        updateCombinedPageVisibility();
        return;
      }

      module.style.setProperty(
        "--track-controls-delay",
        `${1120 + tracks.length * 95}ms`
      );

      module.style.setProperty(
        "--track-mobile-controls-delay",
        `${300 + tracks.length * 90}ms`
      );

      tracks.forEach((track, index) => {
        const row = document.createElement("button");
        row.className = "track-row";
        row.type = "button";

        row.style.setProperty(
          "--track-sequence-delay",
          `${1000 + index * 75}ms`
        );

        row.style.setProperty(
          "--track-mobile-sequence-delay",
          `${190 + index * 72}ms`
        );

        const number =
          String(index + 1).padStart(2, "0");

        const numberLabel =
          document.createElement("span");

        numberLabel.className = "track-number";
        numberLabel.textContent = number;

        const progress =
          document.createElement("span");

        progress.className = "track-row-progress";
        progress.setAttribute(
          "aria-hidden",
          "true"
        );

        const progressFill =
          document.createElement("span");

        progressFill.className =
          "track-row-progress-fill";

        progress.appendChild(progressFill);

        const stateIcon =
          document.createElement("span");

        stateIcon.className = "track-row-icon";
        stateIcon.setAttribute(
          "aria-hidden",
          "true"
        );

        const titleLabel =
          document.createElement("span");

        titleLabel.className = "track-title";

        const audioFilename = String(
          track.audio || ""
        )
          .split("/")
          .pop()
          .replace(/\.[^.]+$/, "");

        const displayName =
          String(track.name || "").trim();

        const accessibleName =
          displayName ||
          audioFilename ||
          `track ${number}`;

        if (displayName) {
          const titleText =
            document.createElement("span");

          titleText.className =
            "track-title-text";

          titleText.textContent = displayName;
          titleLabel.appendChild(titleText);
        } else {
          row.classList.add(
            "no-display-name"
          );

          titleLabel.hidden = true;
        }

        row.append(
          numberLabel,
          titleLabel,
          progress,
          stateIcon
        );

        row.disabled = !track.audio;
        row.setAttribute(
          "aria-label",
          track.audio
            ? `Play ${accessibleName}`
            : `${accessibleName} has no audio`
        );

        const normalizedVolume =
          normalizeTrackVolume(
            track.volume,
            0.5
          );

        const play = event => {
          event?.stopPropagation?.();

          return toggleTrack(
            index,
            track.audio || "",
            normalizedVolume,
            row,
            row,
            progressFill,
            Boolean(event)
          );
        };

        trackPlaylist.push({
          index,
          source: track.audio || "",
          volume: normalizedVolume,
          row,
          button: row,
          progress: progressFill
        });

        if (!firstTrackAutoStart && track.audio) {
          firstTrackPreloadSource =
            resolveAudioSource(track.audio);

          trackAudio.preload = "auto";
          trackAudio.src = firstTrackPreloadSource;
          trackAudio.load();

          firstTrackAutoStart = () => play();
        }

        row.addEventListener("click", play);
        container.appendChild(row);

        // Measured after every row has been created and
        // after the tracklist has moved into its final layout.
      });

      updateDesktopTracklistPlacement();
      updateCombinedPageVisibility();

      scheduleTrackTitleMarqueeRefresh();
      observeTrackTitleWidths();

      if (document.fonts?.ready) {
        document.fonts.ready.then(() => {
          scheduleTrackTitleMarqueeRefresh();
        });
      }
    }

    const DECRYPT_CHARACTERS = "01";

    function measureProfileTextWidth(
      sourceElement,
      value
    ) {
      if (!sourceElement) {
        return 0;
      }

      const probe =
        sourceElement.cloneNode(false);

      probe.removeAttribute("id");
      probe.removeAttribute("aria-label");
      probe.textContent = String(value || "");

      Object.assign(probe.style, {
        position: "fixed",
        top: "0",
        left: "-10000px",
        display: "block",
        width: "max-content",
        minWidth: "0",
        maxWidth: "none",
        margin: "0",
        opacity: "0",
        visibility: "hidden",
        whiteSpace: "nowrap",
        animation: "none",
        transform: "none",
        pointerEvents: "none"
      });

      document.body.appendChild(probe);

      const measuredWidth =
        probe.getBoundingClientRect().width;

      probe.remove();

      return measuredWidth;
    }

    function lockProfileIdentityWidth() {
      const identity =
        document.querySelector(
          ".profile-page .identity"
        );

      const name =
        document.getElementById("name");

      const bio =
        document.getElementById("bio");

      if (!identity || !name || !bio) {
        return;
      }

      const finalName =
        name.dataset.finalText ||
        name.textContent ||
        "";

      const finalBio =
        bio.dataset.finalText ||
        bio.textContent ||
        "";

      const measuredWidth = Math.ceil(
        Math.max(
          measureProfileTextWidth(
            name,
            finalName
          ),
          measureProfileTextWidth(
            bio,
            finalBio
          ),
          1
        )
      );

      identity.style.setProperty(
        "--profile-identity-width",
        measuredWidth + "px"
      );
    }

    const decryptAnimations = new WeakMap();

    function randomDecryptCharacter() {
      return DECRYPT_CHARACTERS[
        Math.floor(
          Math.random() *
          DECRYPT_CHARACTERS.length
        )
      ];
    }

    function cancelDecryptAnimation(element) {
      const animation =
        decryptAnimations.get(element);

      if (!animation) {
        return;
      }

      clearTimeout(animation.timeoutId);
      clearInterval(animation.intervalId);
      decryptAnimations.delete(element);
    }

    function holdBinaryText(
      element,
      finalText,
      interval = 72
    ) {
      if (!element) {
        return;
      }

      cancelDecryptAnimation(element);

      const characters = Array.from(
        String(finalText || "")
      );

      const finalValue = characters.join("");

      element.dataset.finalText = finalValue;
      element.setAttribute(
        "aria-label",
        finalValue
      );

      if (!characters.length) {
        element.textContent = "";
        return;
      }

      const draw = () => {
        element.textContent = characters
          .map(character => {
            if (/\s/.test(character)) {
              return character;
            }

            return randomDecryptCharacter();
          })
          .join("");
      };

      const state = {
        timeoutId: 0,
        intervalId: 0
      };

      draw();

      state.intervalId =
        window.setInterval(draw, interval);

      decryptAnimations.set(element, state);
    }

    function decryptText(
      element,
      finalText,
      {
        duration = 1500,
        delay = 0,
        interval = 38
      } = {}
    ) {
      if (!element) {
        return Promise.resolve();
      }

      cancelDecryptAnimation(element);

      const characters = Array.from(
        String(finalText || "")
      );

      const finalValue = characters.join("");

      element.dataset.finalText = finalValue;
      element.setAttribute(
        "aria-label",
        finalValue
      );

      if (!characters.length) {
        element.textContent = "";
        return Promise.resolve();
      }

      return new Promise(resolve => {
        const state = {
          timeoutId: 0,
          intervalId: 0
        };

        const draw = revealCount => {
          element.textContent = characters
            .map((character, index) => {
              if (
                index < revealCount ||
                /\s/.test(character)
              ) {
                return character;
              }

              return randomDecryptCharacter();
            })
            .join("");
        };

        // Put scrambled text in place immediately, even while
        // the entry overlay is fading.
        draw(0);

        state.timeoutId = window.setTimeout(
          () => {
            const startedAt = performance.now();

            state.intervalId =
              window.setInterval(
                () => {
                  const elapsed =
                    performance.now() - startedAt;

                  const progress = Math.min(
                    1,
                    elapsed / duration
                  );

                  // Slightly slower reveal at the beginning makes
                  // the scrambling much easier to notice.
                  const revealProgress =
                    Math.pow(progress, 1.35);

                  const revealCount = Math.floor(
                    revealProgress *
                    characters.length
                  );

                  draw(revealCount);

                  if (progress >= 1) {
                    clearInterval(
                      state.intervalId
                    );

                    element.textContent =
                      finalValue;

                    decryptAnimations.delete(
                      element
                    );

                    resolve();
                  }
                },
                interval
              );
          },
          delay
        );

        decryptAnimations.set(element, state);
      });
    }

    async function startProfileDecryptAnimation() {
      const name =
        document.getElementById("name");

      const bio =
        document.getElementById("bio");

      const finalName =
        name?.dataset.finalText ||
        name?.textContent ||
        "";

      const finalBio =
        bio?.dataset.finalText ||
        bio?.textContent ||
        "";

      const mobileAnimation =
        window.matchMedia(
          "(max-width: 760px), (pointer: coarse)"
        ).matches;

      const nameInterval =
        mobileAnimation ? 92 : 70;

      const bioInterval =
        mobileAnimation ? 98 : 76;

      holdBinaryText(
        name,
        finalName,
        nameInterval
      );

      holdBinaryText(
        bio,
        finalBio,
        bioInterval
      );

      // Let both strings visibly scramble as the entry screen fades.
      await new Promise(resolve => {
        window.setTimeout(resolve, 260);
      });

      await decryptText(
        name,
        finalName,
        {
          duration: 760,
          delay: 0,
          interval: nameInterval
        }
      );

      await decryptText(
        bio,
        finalBio,
        {
          duration: 980,
          delay: 0,
          interval: bioInterval
        }
      );
    }

    let siteEntered = false;
    let siteEntryStarted = false;
    let tracklistSequenceDesktopPlayed = false;
    let tracklistSequenceMobilePlayed = false;
    let tracklistSequenceMobileTimer = 0;

    function restartTracklistSequence(
      mode = "desktop"
    ) {
      const module =
        document.getElementById(
          "tracklistModule"
        );

      if (!module || module.hidden) {
        return;
      }

      module.classList.toggle(
        "mobile-sequence",
        mode === "mobile"
      );

      module.classList.remove(
        "sequence-active"
      );

      void module.offsetWidth;

      module.classList.add(
        "sequence-active"
      );
    }

    function updateTracklistSequence() {
      const module =
        document.getElementById(
          "tracklistModule"
        );

      if (
        !siteEntered ||
        !module ||
        module.hidden
      ) {
        return;
      }

      if (isDesktopTracklistLayout()) {
        clearTimeout(
          tracklistSequenceMobileTimer
        );

        tracklistSequenceMobileTimer = 0;

        if (!tracklistSequenceDesktopPlayed) {
          tracklistSequenceDesktopPlayed = true;

          restartTracklistSequence(
            "desktop"
          );
        }

        return;
      }

      const activePage =
        snapPages[snapActiveIndex];

      if (
        activePage?.id !== "modulesPage" ||
        tracklistSequenceMobilePlayed
      ) {
        return;
      }

      tracklistSequenceMobilePlayed = true;

      clearTimeout(
        tracklistSequenceMobileTimer
      );

      tracklistSequenceMobileTimer =
        window.setTimeout(
          () => {
            const currentPage =
              snapPages[snapActiveIndex];

            if (
              !siteEntered ||
              isDesktopTracklistLayout() ||
              currentPage?.id !==
                "modulesPage"
            ) {
              tracklistSequenceMobilePlayed =
                false;

              return;
            }

            restartTracklistSequence(
              "mobile"
            );
          },
          SNAP_DURATION + 30
        );
    }

    const initialBufferStartedAt =
      performance.now();

    function waitForInitialImage(source) {
      if (!source) {
        return Promise.resolve();
      }

      return new Promise(resolve => {
        const image = new Image();
        let settled = false;

        const finish = async () => {
          if (settled) {
            return;
          }

          settled = true;

          try {
            if (
              typeof image.decode ===
              "function"
            ) {
              await image.decode();
            }
          } catch {
            // Decoding can reject even when the image is usable.
          }

          resolve();
        };

        image.onload = finish;
        image.onerror = finish;
        image.decoding = "async";
        image.fetchPriority = "high";
        image.src = source;

        if (image.complete) {
          void finish();
        }
      });
    }

    function waitForInitialAudio(
      audio,
      timeout = 1800
    ) {
      if (!audio) {
        return Promise.resolve();
      }

      return new Promise(resolve => {
        let settled = false;

        const finish = () => {
          if (settled) {
            return;
          }

          settled = true;
          clearTimeout(timer);

          audio.removeEventListener(
            "canplaythrough",
            finish
          );

          audio.removeEventListener(
            "error",
            finish
          );

          resolve();
        };

        const timer = setTimeout(
          finish,
          timeout
        );

        audio.addEventListener(
          "canplaythrough",
          finish,
          { once: true }
        );

        audio.addEventListener(
          "error",
          finish,
          { once: true }
        );

        try {
          audio.load();
        } catch {
          finish();
        }

        if (audio.readyState >= 3) {
          finish();
        }
      });
    }

    function waitForWindowLoad() {
      if (document.readyState === "complete") {
        return Promise.resolve();
      }

      return new Promise(resolve => {
        window.addEventListener(
          "load",
          resolve,
          { once: true }
        );
      });
    }

    async function waitForDefaultBackground() {
      const webpLoaded =
        await new Promise(resolve => {
          const image = new Image();

          image.onload = () => resolve(true);
          image.onerror = () => resolve(false);
          image.decoding = "async";
          image.fetchPriority = "high";
          image.src = "bg.webp";

          if (image.complete) {
            resolve(image.naturalWidth > 0);
          }
        });

      if (!webpLoaded) {
        await waitForInitialImage("bg.png");
      }
    }

    async function prepareInitialView(data = {}) {
      const customPageBackground =
        String(
          data.pageOneBackground || ""
        ).trim();

      const avatarSource =
        data.avatar ||
        "";

      const mobileInitialLoad =
        window.matchMedia(
          "(max-width: 760px), (pointer: coarse)"
        ).matches;

      const fontReady =
        document.fonts?.ready ||
        Promise.resolve();

      const readinessTasks = [
        waitForWindowLoad(),
        fontReady,
        prepareUnlockBeepBuffer(),
        customPageBackground
          ? waitForInitialImage(
              customPageBackground
            )
          : waitForDefaultBackground(),
        waitForInitialImage(avatarSource),
        waitForInitialAudio(
          unlockBeepAudio,
          mobileInitialLoad
            ? 3200
            : 1800
        )
      ];

      if (firstTrackPreloadSource) {
        readinessTasks.push(
          waitForInitialAudio(
            trackAudio,
            mobileInitialLoad
              ? 4500
              : 2600
          )
        );
      }

      await Promise.race([
        Promise.allSettled(
          readinessTasks
        ),
        new Promise(resolve => {
          setTimeout(
            resolve,
            mobileInitialLoad
              ? 6500
              : 5000
          );
        })
      ]);

      // Give mobile browsers a brief idle window after decoding
      // and buffering before the interactive entry animation begins.
      if (mobileInitialLoad) {
        await new Promise(resolve => {
          setTimeout(resolve, 160);
        });
      }

      const minimumVisibleTime =
        mobileInitialLoad
          ? 1600
          : 420;

      const elapsed =
        performance.now() -
        initialBufferStartedAt;

      if (elapsed < minimumVisibleTime) {
        await new Promise(resolve => {
          setTimeout(
            resolve,
            minimumVisibleTime - elapsed
          );
        });
      }
    }

    function enableEnterScreen() {
      const enterScreen =
        document.getElementById("enterScreen");

      const bufferScreen =
        document.getElementById(
          "initialBufferScreen"
        );

      if (bufferScreen) {
        bufferScreen.classList.add(
          "is-ready"
        );

        setTimeout(() => {
          bufferScreen.hidden = true;
        }, 340);
      }

      if (enterScreen) {
        setTimeout(() => {
          enterScreen.disabled = false;
        }, bufferScreen ? 220 : 0);
      }
    }

    let profileBackgroundBootStarted = false;

    function startProfileBackgroundBoot() {
      if (profileBackgroundBootStarted) {
        return;
      }

      const background =
        document.getElementById(
          "profileBackgroundBoot"
        );

      if (!background) {
        return;
      }

      profileBackgroundBootStarted = true;

      background.addEventListener(
        "animationend",
        event => {
          if (
            event.animationName !==
            "profileBackgroundEnter"
          ) {
            return;
          }

          background.classList.remove(
            "booting"
          );

          background.classList.add(
            "ready"
          );
        },
        { once: true }
      );

      background.classList.add("booting");
    }

    function releaseEntryWillChange() {
      [
        document.getElementById("avatar"),
        document.getElementById("name"),
        document.getElementById("bio"),
        document.getElementById(
          "profileBackgroundBoot"
        ),
        document.querySelector(
          ".page-indicator"
        ),
        document.getElementById(
          "scrollDirectionIndicator"
        ),
        document.getElementById("entryLock")
      ].forEach(element => {
        if (element) {
          element.style.willChange = "auto";
        }
      });
    }

    function scheduleEntryWillChangeRelease() {
      setTimeout(
        releaseEntryWillChange,
        2300
      );
    }

    function primeSiteEntry() {
      if (siteEntryAudioPrimed) {
        return;
      }

      siteEntryAudioPrimed = true;

      try {
        primeUnlockAudioFromGesture();
      } catch (error) {
        console.error(
          "Could not prime unlock audio:",
          error
        );
      }

      try {
        initializeTrackAudioOutput();
        primeFirstTrackForUnlock();
      } catch (error) {
        console.error(
          "Could not initialize entry audio:",
          error
        );
      }
    }

    function revealSiteAfterUnlock(enterScreen) {
      if (siteEntered) {
        return;
      }

      siteEntered = true;

      scheduleGalleryAssetLoad();
      syncClockLifecycle();
      syncGalleryBottomVisualizer();

      // The gate begins its slow opacity fade after the lock has remained fully visible for a brief moment.
      // The live site and its synchronized entrance animations are already
      // running underneath, so there is no second reveal after the lock.
      enterScreen.classList.add("revealing");

      setTimeout(() => {
        enterScreen.classList.add("entered");
        enterScreen.hidden = true;
      }, 2950);
    }

    function enterSite() {
      if (siteEntered || siteEntryStarted) {
        return;
      }

      const enterScreen =
        document.getElementById("enterScreen");

      if (!enterScreen) {
        return;
      }

      siteEntryStarted = true;
      enterScreen.disabled = true;

      // Set up one-shot audio synchronization before the CSS
      // animation begins, so animationstart cannot be missed.
      scheduleUnlockBeep();
      enterScreen.classList.add("unlocking");

      const mobileEntryAnimation =
        window.matchMedia(
          "(max-width: 760px), (pointer: coarse)"
        ).matches;

      // Let the lock render smoothly before starting the heavier
      // background, profile, decrypt, and tracklist effects underneath.
      const startHeavyEntryEffects = () => {
        document.body.classList.add("site-entered");

        try {
          startProfileBackgroundBoot();
        } catch (error) {
          console.error(
            "Could not start background animation:",
            error
          );
        }

        try {
          updateTracklistSequence();
        } catch (error) {
          console.error(
            "Could not start tracklist sequence:",
            error
          );
        }

        const beginProfileTextAnimation = () => {
          try {
            startProfileDecryptAnimation();
          } catch (error) {
            console.error(
              "Could not start profile animation:",
              error
            );
          }
        };

        if (mobileEntryAnimation) {
          window.setTimeout(
            beginProfileTextAnimation,
            260
          );
        } else {
          beginProfileTextAnimation();
        }

        try {
          updateScrollDirectionIndicator();
        } catch (error) {
          console.error(
            "Could not update scroll indicator:",
            error
          );
        }

        scheduleEntryWillChangeRelease();
      };

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          setTimeout(
            startHeavyEntryEffects,
            420
          );
        });
      });

      // Pointer-down normally completes this before the click
      // starts the animation. Keep this fallback for keyboard entry
      // or WebViews that omit pointer events.
      if (!siteEntryAudioPrimed) {
        primeSiteEntry();
      }

      // The lock gets a brief head start, then the longer overlay fade
      // overlaps the synchronized site entrance underneath.
      revealSiteAfterUnlock(enterScreen);
    }

    function isDesktopTracklistLayout() {
      return window.matchMedia(
        "(min-width: 1101px) and (pointer: fine)"
      ).matches;
    }

    function updateDesktopTracklistPlacement() {
      const module =
        document.getElementById("tracklistModule");

      const home =
        document.getElementById("tracklistHome");

      const dock =
        document.getElementById(
          "desktopTracklistDock"
        );

      if (!module || !home || !dock) {
        return;
      }

      const shouldDock =
        isDesktopTracklistLayout() &&
        !module.hidden;

      if (shouldDock) {
        if (module.parentElement !== dock) {
          dock.appendChild(module);
        }

        dock.hidden = false;
        module.classList.add("is-docked");
      } else {
        if (module.parentElement !== home) {
          home.appendChild(module);
        }

        module.classList.remove("is-docked");
        dock.hidden = true;
      }

      scheduleTrackTitleMarqueeRefresh();
    }

    function updateScrollDirectionIndicator() {
      const indicator =
        document.getElementById(
          "scrollDirectionIndicator"
        );

      const up =
        document.getElementById("scrollDirectionUp");

      const down =
        document.getElementById("scrollDirectionDown");

      if (!indicator || !up || !down) {
        return;
      }

      const canScrollUp = snapActiveIndex > 0;
      const canScrollDown =
        snapActiveIndex < snapPages.length - 1;

      const shouldShow =
        siteEntered &&
        (canScrollUp || canScrollDown);

      if (shouldShow) {
        indicator.hidden = false;

        if (
          !indicator.classList.contains(
            "is-visible"
          )
        ) {
          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              indicator.classList.add(
                "is-visible"
              );
            });
          });
        }
      } else {
        indicator.classList.remove(
          "is-visible"
        );

        indicator.hidden = true;
      }

      up.classList.toggle(
        "is-hidden",
        !canScrollUp
      );

      down.classList.toggle(
        "is-hidden",
        !canScrollDown
      );
    }

    let galleryAssetsLoaded = false;
    let galleryAssetIdleHandle = 0;

    function loadGalleryAssets() {
      if (galleryAssetsLoaded) {
        return;
      }

      galleryAssetsLoaded = true;

      document
        .querySelectorAll(
          "img[data-gallery-src]"
        )
        .forEach(image => {
          const source =
            image.dataset.gallerySrc;

          if (!source) {
            return;
          }

          image.src = source;
          image.removeAttribute(
            "data-gallery-src"
          );
        });
    }

    function scheduleGalleryAssetLoad() {
      if (
        galleryAssetsLoaded ||
        galleryAssetIdleHandle ||
        !isDesktopGalleryAvailable()
      ) {
        return;
      }

      const run = () => {
        galleryAssetIdleHandle = 0;
        loadGalleryAssets();
      };

      if (
        typeof window.requestIdleCallback ===
        "function"
      ) {
        galleryAssetIdleHandle =
          window.requestIdleCallback(
            run,
            { timeout: 2600 }
          );
      } else {
        galleryAssetIdleHandle =
          window.setTimeout(run, 1200);
      }
    }

    let snapPages = [];
    let snapActiveIndex = 0;
    let snapInitialized = false;
    let touchStartY = null;
    let wheelAccumulator = 0;
    let wheelLastEventAt = 0;
    let wheelCooldownUntil = 0;

    const SNAP_DURATION = 420;
    const WHEEL_THRESHOLD = 24;
    const WHEEL_COOLDOWN = 105;

    function isDesktopGalleryAvailable() {
      return (
        window.innerWidth >= 1101 &&
        window.matchMedia(
          "(pointer: fine)"
        ).matches
      );
    }

    function updateGalleryPageAvailability(
      refresh = true
    ) {
      const page =
        document.getElementById("galleryPage");

      const indicator =
        document.getElementById(
          "galleryIndicator"
        );

      if (!page || !indicator) {
        return;
      }

      const available =
        isDesktopGalleryAvailable();

      page.hidden = !available;
      indicator.hidden = !available;

      if (
        !available &&
        snapPages[snapActiveIndex]?.id ===
          "galleryPage"
      ) {
        snapActiveIndex = Math.max(
          0,
          snapActiveIndex - 1
        );
      }

      if (refresh && snapInitialized) {
        refreshSnapPages();
      }
    }

    function refreshSnapPages() {
      snapPages = Array.from(
        document.querySelectorAll(
          "[data-snap-page]:not([hidden])"
        )
      );

      snapActiveIndex = Math.min(
        snapActiveIndex,
        Math.max(0, snapPages.length - 1)
      );

      applySnapPosition(false);
      updatePageIndicator();
    }

    function updatePageIndicator() {
      const activePage = snapPages[snapActiveIndex];

      document.body.dataset.activePage =
        activePage?.id || "";

      document
        .querySelectorAll(".page-indicator-button")
        .forEach(button => {
          button.classList.toggle(
            "active",
            activePage &&
            button.dataset.pageTarget === activePage.id
          );
        });

      updateScrollDirectionIndicator();
      updateDesktopTracklistPlacement();
      updateTracklistSequence();
      syncClockLifecycle();
      syncGalleryBottomVisualizer();

      if (activePage?.id === "galleryPage") {
        loadGalleryAssets();
      }
    }

    function applySnapPosition(animate = true) {
      const container =
        document.getElementById("snapContainer");

      const track =
        document.getElementById("snapTrack");

      if (!container || !track) {
        return;
      }

      const targetY =
        -snapActiveIndex * container.clientHeight;

      if (!animate) {
        track.style.transition = "none";
        track.style.transform =
          `translate3d(0, ${targetY}px, 0)`;

        // Force the non-animated position to be committed before
        // restoring the normal transition for future page changes.
        track.getBoundingClientRect();
        track.style.transition = "";
        return;
      }

      track.style.transition =
        `transform ${SNAP_DURATION}ms ` +
        "cubic-bezier(0.22, 0.8, 0.25, 1)";

      track.style.transform =
        `translate3d(0, ${targetY}px, 0)`;
    }

    function goToPage(index) {
      refreshSnapPages();

      const boundedIndex = Math.max(
        0,
        Math.min(index, snapPages.length - 1)
      );

      if (!snapPages[boundedIndex]) {
        return;
      }

      if (boundedIndex === snapActiveIndex) {
        return;
      }

      snapActiveIndex = boundedIndex;
      updatePageIndicator();
      applySnapPosition(true);
    }

    function goToPageById(pageId) {
      refreshSnapPages();

      const index = snapPages.findIndex(
        page => page.id === pageId
      );

      if (index >= 0) {
        goToPage(index);
      }
    }

    function scrollToNextPage() {
      goToPage(snapActiveIndex + 1);
    }

    function normalizeWheelDelta(event) {
      if (event.deltaMode === WheelEvent.DOM_DELTA_LINE) {
        return event.deltaY * 16;
      }

      if (event.deltaMode === WheelEvent.DOM_DELTA_PAGE) {
        return event.deltaY * window.innerHeight;
      }

      return event.deltaY;
    }

    function initSnapNavigation() {
      refreshSnapPages();

      if (snapInitialized) {
        return;
      }

      snapInitialized = true;

      window.addEventListener(
        "wheel",
        event => {
          if (
            event.ctrlKey ||
            Math.abs(event.deltaX) > Math.abs(event.deltaY)
          ) {
            return;
          }

          event.preventDefault();

          if (!siteEntered) {
            return;
          }

          const now = performance.now();
          const delta = normalizeWheelDelta(event);

          if (now - wheelLastEventAt > 140) {
            wheelAccumulator = 0;
          }

          wheelLastEventAt = now;
          wheelAccumulator += delta;

          if (
            now < wheelCooldownUntil ||
            Math.abs(wheelAccumulator) < WHEEL_THRESHOLD
          ) {
            return;
          }

          const direction = wheelAccumulator > 0 ? 1 : -1;

          wheelAccumulator = 0;
          wheelCooldownUntil = now + WHEEL_COOLDOWN;

          goToPage(snapActiveIndex + direction);
        },
        {
          passive: false,
          capture: true
        }
      );

      window.addEventListener(
        "touchstart",
        event => {
          const target = event.target;

          if (
            !siteEntered ||
            target?.closest?.(
              "a, button, [role='button'], [data-prevent-page-swipe], input, select, textarea"
            )
          ) {
            touchStartY = null;
            return;
          }

          touchStartY =
            event.changedTouches[0]?.clientY ?? null;
        },
        { passive: true }
      );

      window.addEventListener(
        "touchend",
        event => {
          if (touchStartY === null) {
            return;
          }

          const endY =
            event.changedTouches[0]?.clientY ?? touchStartY;

          const distance = touchStartY - endY;
          touchStartY = null;

          if (Math.abs(distance) < 28) {
            return;
          }

          goToPage(
            snapActiveIndex +
            (distance > 0 ? 1 : -1)
          );
        },
        { passive: true }
      );

      window.addEventListener("keydown", event => {
        if (!siteEntered) {
          return;
        }

        if (["ArrowDown", "PageDown", " "].includes(event.key)) {
          event.preventDefault();
          goToPage(snapActiveIndex + 1);
        }

        if (["ArrowUp", "PageUp"].includes(event.key)) {
          event.preventDefault();
          goToPage(snapActiveIndex - 1);
        }

        if (event.key === "Home") {
          event.preventDefault();
          goToPage(0);
        }

        if (event.key === "End") {
          event.preventDefault();
          goToPage(snapPages.length - 1);
        }
      });

    }

    let globalResizeFrame = 0;

    function handleGlobalResize() {
      globalResizeFrame = 0;

      updateGalleryPageAvailability(false);
      refreshSnapPages();
      lockProfileIdentityWidth();
      scheduleTrackTitleMarqueeRefresh();
      refreshGalleryVisualizerMetrics();
      syncGalleryBottomVisualizer();
    }

    function scheduleGlobalResize() {
      if (globalResizeFrame) {
        return;
      }

      globalResizeFrame =
        requestAnimationFrame(
          handleGlobalResize
        );
    }

    window.addEventListener(
      "resize",
      scheduleGlobalResize,
      { passive: true }
    );

    let galleryVisualizerFrame = 0;
    let galleryVisualizerStopTimer = 0;
    let galleryVisualizerLevels = [];
    let galleryVisualizerCanvas = null;
    let galleryVisualizerContext = null;
    let galleryVisualizerPage = null;
    let galleryVisualizerRunning = false;
    let galleryVisualizerAccent = "#707070";
    let galleryVisualizerMetrics = {
      width: 0,
      height: 0,
      pixelRatio: 1
    };

    function hexToRgba(
      color,
      alpha
    ) {
      const normalized = String(color || "")
        .trim()
        .replace("#", "");

      const value =
        normalized.length === 3
          ? normalized
              .split("")
              .map(character => character + character)
              .join("")
          : normalized;

      if (!/^[0-9a-f]{6}$/i.test(value)) {
        return `rgba(112, 112, 112, ${alpha})`;
      }

      const red =
        parseInt(value.slice(0, 2), 16);

      const green =
        parseInt(value.slice(2, 4), 16);

      const blue =
        parseInt(value.slice(4, 6), 16);

      return `rgba(${red}, ${green}, ${blue}, ${alpha})`;
    }

    function cacheGalleryVisualizerElements() {
      galleryVisualizerCanvas ||=
        document.getElementById(
          "galleryBottomVisualizer"
        );

      galleryVisualizerPage ||=
        document.getElementById(
          "galleryPage"
        );

      if (
        galleryVisualizerCanvas &&
        !galleryVisualizerContext
      ) {
        galleryVisualizerContext =
          galleryVisualizerCanvas.getContext(
            "2d"
          );
      }
    }

    function refreshGalleryVisualizerAccent() {
      galleryVisualizerAccent =
        getComputedStyle(
          document.documentElement
        )
          .getPropertyValue(
            "--track-accent-color"
          )
          .trim() || "#707070";
    }

    function refreshGalleryVisualizerMetrics() {
      cacheGalleryVisualizerElements();

      const canvas =
        galleryVisualizerCanvas;

      if (!canvas) {
        return;
      }

      const bounds =
        canvas.getBoundingClientRect();

      const pixelRatio = Math.min(
        window.devicePixelRatio || 1,
        2
      );

      const renderWidth = Math.max(
        1,
        Math.round(
          bounds.width * pixelRatio
        )
      );

      const renderHeight = Math.max(
        1,
        Math.round(
          bounds.height * pixelRatio
        )
      );

      if (
        canvas.width !== renderWidth ||
        canvas.height !== renderHeight
      ) {
        canvas.width = renderWidth;
        canvas.height = renderHeight;
      }

      galleryVisualizerMetrics = {
        width: bounds.width,
        height: bounds.height,
        pixelRatio
      };
    }

    function shouldRunGalleryVisualizer() {
      cacheGalleryVisualizerElements();

      return Boolean(
        siteEntered &&
        !document.hidden &&
        galleryVisualizerCanvas &&
        galleryVisualizerContext &&
        galleryVisualizerPage &&
        !galleryVisualizerPage.hidden &&
        document.body.dataset.activePage ===
          "galleryPage"
      );
    }

    function drawGalleryBottomVisualizer(time) {
      if (
        !galleryVisualizerRunning ||
        !galleryVisualizerCanvas ||
        !galleryVisualizerContext
      ) {
        galleryVisualizerFrame = 0;
        return;
      }

      const context =
        galleryVisualizerContext;

      const {
        width,
        height,
        pixelRatio
      } = galleryVisualizerMetrics;

      const accent =
        galleryVisualizerAccent;

      context.setTransform(
        pixelRatio,
        0,
        0,
        pixelRatio,
        0,
        0
      );

      context.clearRect(0, 0, width, height);

      if (width > 20 && height > 20) {
        const playing =
          !trackAudio.paused &&
          !trackAudio.ended &&
          Boolean(
            trackAnalyserNode &&
            trackFrequencyData
          );

        if (
          playing &&
          trackAnalyserNode &&
          trackFrequencyData
        ) {
          trackAnalyserNode.getByteFrequencyData(
            trackFrequencyData
          );
        }

        const barCount = Math.max(
          24,
          Math.min(
            108,
            Math.floor(width / 12)
          )
        );

        const centerX = width / 2;
        const baseline = height - 4;
        const horizontalPadding = 10;

        const availableHalf = Math.max(
          1,
          centerX - horizontalPadding
        );

        const spacing =
          availableHalf /
          Math.max(1, barCount);

        const maxHeight = height * 0.82;
        const minimumHeight = 3;

        context.lineWidth = Math.max(
          1.25,
          Math.min(2.6, width / 520)
        );

        context.lineCap = "round";

        for (
          let index = 0;
          index < barCount;
          index += 1
        ) {
          let amplitude;

          const progress =
            index /
            Math.max(1, barCount - 1);

          if (
            playing &&
            trackFrequencyData &&
            trackFrequencyData.length
          ) {
            const curvedProgress =
              Math.pow(progress, 1.72);

            const usableBins =
              Math.max(
                2,
                Math.floor(
                  trackFrequencyData.length * 0.24
                )
              );

            const floatingBin =
              curvedProgress *
              (usableBins - 1);

            const lowerBin =
              Math.floor(floatingBin);

            const upperBin = Math.min(
              trackFrequencyData.length - 1,
              lowerBin + 1
            );

            const blend =
              floatingBin - lowerBin;

            const interpolated =
              trackFrequencyData[lowerBin] *
                (1 - blend) +
              trackFrequencyData[upperBin] *
                blend;

            const previousBin = Math.max(
              0,
              lowerBin - 1
            );

            const nextBin = Math.min(
              trackFrequencyData.length - 1,
              upperBin + 1
            );

            const smoothed =
              (
                trackFrequencyData[previousBin] *
                  0.05 +
                interpolated *
                  0.90 +
                trackFrequencyData[nextBin] *
                  0.05
              ) /
              255;

            const outerGain =
              1 + progress * 0.32;

            const visibilityFloor =
              0.008 + progress * 0.012;

            const volumeScale =
              Math.pow(
                Math.max(
                  0,
                  Math.min(
                    1,
                    getTrackMasterGain()
                  )
                ),
                0.88
              );

            const bassPresence =
              Math.pow(
                1 - progress,
                2.1
              );

            const bassDrive =
              1 + bassPresence * 0.22;

            const rawAmplitude =
              Math.max(
                visibilityFloor * volumeScale,
                smoothed *
                  outerGain *
                  volumeScale *
                  bassDrive
              );

            const compressionDrive = 0.94;

            amplitude =
              (
                Math.atan(
                  rawAmplitude *
                  compressionDrive
                ) /
                (Math.PI / 2)
              ) *
              0.92;

            const bassContour =
              0.92 +
              Math.pow(progress, 0.55) * 0.18;

            amplitude *= bassContour;

            amplitude = Math.max(
              visibilityFloor * volumeScale,
              amplitude
            );
          } else {
            const volumeScale =
              Math.pow(
                Math.max(
                  0,
                  Math.min(
                    1,
                    getTrackMasterGain()
                  )
                ),
                0.88
              );

            amplitude =
              (
                0.035 +
                (
                  Math.sin(
                    time * 0.0018 +
                    index * 0.46
                  ) +
                  1
                ) *
                0.014
              ) *
              volumeScale;
          }

          const targetAmplitude =
            amplitude;

          const currentAmplitude =
            galleryVisualizerLevels[index] ??
            targetAmplitude;

          const bassResponse =
            Math.pow(
              1 - progress,
              1.7
            );

          const response =
            playing
              ? (
                  targetAmplitude >
                  currentAmplitude
                    ? 0.43 +
                      bassResponse * 0.10
                    : 0.21 +
                      bassResponse * 0.04
                )
              : 0.055;

          amplitude =
            currentAmplitude +
            (
              targetAmplitude -
              currentAmplitude
            ) *
            response;

          galleryVisualizerLevels[index] =
            amplitude;

          const edgeProgress =
            Math.max(
              0,
              Math.min(
                1,
                (progress - 0.82) / 0.18
              )
            );

          const smoothEdge =
            edgeProgress *
            edgeProgress *
            (3 - 2 * edgeProgress);

          const sideFade =
            Math.max(
              0.22,
              1 - smoothEdge * 0.78
            );

          const eased =
            Math.pow(amplitude, 1.04);

          const barHeight =
            minimumHeight +
            eased * maxHeight;

          const distance =
            (index + 0.5) * spacing;

          const leftX =
            centerX - distance;

          const rightX =
            centerX + distance;

          const topY =
            baseline - barHeight;

          const gradient =
            context.createLinearGradient(
              0,
              topY,
              0,
              baseline
            );

          gradient.addColorStop(
            0,
            hexToRgba(
              accent,
              0.94 * sideFade
            )
          );

          gradient.addColorStop(
            0.58,
            hexToRgba(
              accent,
              0.66 * sideFade
            )
          );

          gradient.addColorStop(
            0.86,
            hexToRgba(
              accent,
              0.22 * sideFade
            )
          );

          gradient.addColorStop(
            1,
            hexToRgba(
              accent,
              0.035 * sideFade
            )
          );

          context.strokeStyle = gradient;

          context.beginPath();
          context.moveTo(leftX, baseline);
          context.lineTo(leftX, topY);
          context.stroke();

          context.beginPath();
          context.moveTo(rightX, baseline);
          context.lineTo(rightX, topY);
          context.stroke();
        }
      }

      if (galleryVisualizerRunning) {
        galleryVisualizerFrame =
          requestAnimationFrame(
            drawGalleryBottomVisualizer
          );
      }
    }

    function stopGalleryBottomVisualizer(
      immediate = false
    ) {
      clearTimeout(
        galleryVisualizerStopTimer
      );

      galleryVisualizerStopTimer = 0;

      if (!galleryVisualizerRunning) {
        return;
      }

      const stop = () => {
        galleryVisualizerRunning = false;

        cancelAnimationFrame(
          galleryVisualizerFrame
        );

        galleryVisualizerFrame = 0;
      };

      if (immediate) {
        stop();
        return;
      }

      galleryVisualizerStopTimer =
        setTimeout(
          stop,
          CLOCK_PAGE_TRANSITION_GRACE
        );
    }

    function startGalleryBottomVisualizer() {
      clearTimeout(
        galleryVisualizerStopTimer
      );

      galleryVisualizerStopTimer = 0;

      if (galleryVisualizerRunning) {
        return;
      }

      loadGalleryAssets();
      cacheGalleryVisualizerElements();
      refreshGalleryVisualizerMetrics();
      refreshGalleryVisualizerAccent();

      if (
        !galleryVisualizerCanvas ||
        !galleryVisualizerContext
      ) {
        return;
      }

      galleryVisualizerRunning = true;
      galleryVisualizerFrame =
        requestAnimationFrame(
          drawGalleryBottomVisualizer
        );
    }

    function syncGalleryBottomVisualizer() {
      if (shouldRunGalleryVisualizer()) {
        startGalleryBottomVisualizer();
      } else {
        stopGalleryBottomVisualizer(
          document.hidden || !siteEntered
        );
      }
    }

    function initializeGalleryBottomVisualizer() {
      cacheGalleryVisualizerElements();
      refreshGalleryVisualizerMetrics();
      refreshGalleryVisualizerAccent();
      syncGalleryBottomVisualizer();
